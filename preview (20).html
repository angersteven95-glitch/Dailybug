  <title>Dailybug</title>
  <style>
    :root {
      --bg: #f7f7f5;
      --surface: #ffffff;
      --surface-soft: #fbfbfa;
      --text: #121217;
      --muted: #75757d;
      --faint: #a7a7ad;
      --line: #e7e7ea;
      --accent: #ff2525;
      --accent-soft: #fff0f0;
      --body-bg: radial-gradient(circle at top, #ffffff 0, #f5f5f4 44%, #eeeeed 100%);
      --nav-bg: rgba(255,255,255,.96);
      --shadow: 0 14px 35px rgba(17, 17, 22, .08);
      --soft-shadow: 0 8px 18px rgba(17, 17, 22, .06);
      --radius: 24px;
      --safe-bottom: env(safe-area-inset-bottom, 0px);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    }

    * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
    body {
      margin: 0;
      min-height: 100vh;
      color: var(--text);
      background: var(--body-bg);
      overflow-x: hidden;
    }
    button, input, textarea, select { font: inherit; }
    button { border: 0; cursor: pointer; }
    input, textarea, select {
      width: 100%;
      border: 1px solid var(--line);
      border-radius: 16px;
      background: var(--surface);
      color: var(--text);
      padding: 13px 14px;
      outline: none;
    }
    textarea { min-height: 102px; resize: vertical; }

    .phone-shell {
      width: 100%;
      max-width: 520px;
      margin: 0 auto;
      min-height: 100vh;
      background: var(--surface);
      box-shadow: 0 0 0 1px color-mix(in srgb, var(--line) 55%, transparent);
    }
    .app {
      min-height: 100vh;
      padding: 24px 18px calc(88px + var(--safe-bottom));
      position: relative;
    }

    .topbar { display: flex; align-items: flex-start; justify-content: space-between; gap: 12px; padding: 2px 4px 18px; }
    .brand { line-height: 1; }
    .wordmark { font-size: 34px; font-weight: 900; letter-spacing: -.055em; display: inline-flex; align-items: center; gap: 2px; }
    .wordmark-text { display: inline-flex; align-items: baseline; }
    .wordmark .bug { color: var(--accent); }
    .brand-bug-icon { width: 42px; height: 42px; display: inline-block; flex: 0 0 auto; margin-left: -4px; vertical-align: middle; }
    .brand-bug-icon svg { width: 100%; height: 100%; display: block; }
    .brand-bug-icon .ladybug-shell { fill: var(--accent); }
    .brand-bug-icon .ladybug-detail { fill: var(--text); stroke: var(--text); }
    .brand-bug-icon .ladybug-line { stroke: var(--text); fill: none; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }
    .gear-btn, .back-btn, .icon-btn {
      width: 44px; height: 44px; border-radius: 999px; background: transparent; color: var(--text);
      display: inline-flex; align-items: center; justify-content: center; font-size: 26px;
    }
    .gear-btn { margin-top: 12px; color: var(--muted); }
    .screen-title-row { display: flex; align-items: center; justify-content: center; position: relative; margin: 4px 0 28px; }
    .screen-title-row .back-btn { position: absolute; left: 0; }
    .screen-title { font-size: 24px; font-weight: 850; letter-spacing: -.03em; }

    .date-row { display: grid; grid-template-columns: auto 1fr auto; align-items: center; gap: 14px; margin: 6px 4px 34px; }
    .log-date-row { grid-template-columns: auto 1fr; }
    .date-icon { width: 30px; height: 30px; color: var(--text); }
    .date-main { font-size: 27px; font-weight: 850; letter-spacing: -.04em; }
    .date-sub { color: var(--muted); font-size: 17px; margin-top: 2px; }
    .today-pill { color: var(--accent); background: var(--surface); border: 1px solid var(--line); box-shadow: var(--soft-shadow); border-radius: 999px; padding: 11px 16px; font-weight: 760; display:flex; align-items:center; gap:8px; }

    .section-head { display: flex; align-items: center; justify-content: space-between; gap: 12px; margin: 0 4px 14px; }
    .section-title { font-size: 21px; font-weight: 850; letter-spacing: -.03em; }
    .section-meta { color: var(--muted); font-size: 13px; line-height: 1.25; text-align: right; }
    .section-action { color: var(--accent); background: transparent; font-weight: 750; }
    .section-actions { display:flex; align-items:center; gap:10px; }
    .collapse-btn { color: var(--muted); background: var(--surface); border:1px solid var(--line); border-radius:999px; padding:8px 11px; font-size:13px; font-weight:800; box-shadow:var(--soft-shadow); display:inline-flex; align-items:center; gap:6px; }
    .collapse-btn .collapse-icon { font-size:16px; line-height:1; transform: translateY(-1px); }
    .quick-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 12px; margin-bottom: 34px; }
    .quick-tile {
      min-height: 110px;
      background: var(--surface);
      border: 1px solid var(--line);
      border-radius: 18px;
      box-shadow: var(--soft-shadow);
      display: flex; flex-direction: column; align-items: center; justify-content: center;
      gap: 10px; color: var(--text); transition: transform .12s ease, box-shadow .12s ease;
      touch-action: manipulation;
      user-select: none;
      -webkit-user-select: none;
      -webkit-touch-callout: none;
    }
    .quick-tile:active, .quick-tile.long-pressing { transform: scale(.97); box-shadow: none; }
    .quick-hint { color: var(--muted); font-size: 12px; font-weight: 650; margin: -22px 4px 28px; text-align: center; }
    .quick-note-tile {
      grid-column: 1 / -1;
      min-height: 68px;
      flex-direction: row;
      justify-content: flex-start;
      padding: 0 18px;
      gap: 14px;
      background: var(--accent-soft);
      border-color: color-mix(in srgb, var(--accent) 24%, var(--line));
    }
    .quick-note-tile .quick-emoji { background: var(--surface); color: var(--accent); }
    .quick-note-tile .quick-label { font-size: 18px; }
    .quick-emoji { width: 48px; height: 48px; border-radius: 18px; display: flex; align-items: center; justify-content: center; background: var(--type-soft); color: var(--type-color); }
    .quick-label { font-size: 17px; font-weight: 730; letter-spacing: -.02em; color: var(--text); }
    [data-theme='ladybug-dark'] .quick-label,
    [data-theme='ladybug-dark'] .entry-title,
    [data-theme='ladybug-dark'] .settings-label,
    [data-theme='steelblue-ladybird'] .quick-label,
    [data-theme='steelblue-ladybird'] .entry-title,
    [data-theme='steelblue-ladybird'] .settings-label { color: var(--text); }

    .recent-card, .settings-card, .panel {
      background: var(--surface);
      border: 1px solid var(--line);
      border-radius: 22px;
      box-shadow: var(--soft-shadow);
      overflow: hidden;
    }
    .entry-list { display: flex; flex-direction: column; }
    .recent-row, .entry-row {
      display: grid; grid-template-columns: auto 1fr auto; align-items: center; gap: 14px;
      padding: 14px 16px; border-bottom: 1px solid var(--line); background: var(--surface);
      color: var(--text); text-align: left; appearance: none; -webkit-appearance: none;
    }
    .recent-row:last-child, .entry-row:last-child { border-bottom: 0; }
    .entry-icon { width: 48px; height: 48px; border-radius: 999px; display:flex; align-items:center; justify-content:center; background: var(--type-soft); color: var(--type-color); flex: 0 0 auto; }
    .entry-title { display:block; font-weight: 850; font-size: 18px; letter-spacing: -.025em; color: var(--text); }
    .entry-sub { display:block; color: var(--muted); font-size: 14px; margin-top: 3px; overflow-wrap: anywhere; }
    .entry-time { color: var(--muted); font-size: 14px; white-space: nowrap; }
    .recent-row span:not(.entry-sub):not(.entry-time):not(.chevron), .entry-row span:not(.entry-sub):not(.entry-time):not(.chevron) { color: inherit; }
    .chevron { color: var(--faint); font-size: 28px; line-height: 1; }
    .empty-state { text-align: center; color: var(--muted); padding: 24px 16px; }

    .nav {
      position: fixed; left: 50%; bottom: 0; transform: translateX(-50%);
      width: 100%; max-width: 520px; background: var(--nav-bg); backdrop-filter: blur(18px);
      border-top: 1px solid var(--line); display: grid; grid-template-columns: repeat(4, 1fr);
      gap: 4px; padding: 8px 12px calc(9px + var(--safe-bottom)); z-index: 40;
    }
    .nav button {
      background: transparent;
      color: var(--muted);
      border-radius: 14px;
      padding: 7px 4px;
      display:flex;
      flex-direction:column;
      align-items:center;
      justify-content:center;
      gap:3px;
      font-size: 12px;
      font-weight: 650;
    }
    .nav .nav-icon { width: 28px; height: 28px; line-height: 1; display: inline-flex; align-items: center; justify-content: center; }
    .nav .nav-icon svg { width: 28px; height: 28px; display: block; stroke: currentColor; fill: none; stroke-width: 2.25; stroke-linecap: round; stroke-linejoin: round; }
    .nav button.active { color: var(--accent); }

    .settings-intro { margin: 0 4px 18px; }
    .settings-intro h1 { margin: 0 0 8px; font-size: 27px; letter-spacing: -.045em; }
    .small { color: var(--muted); font-size: 14px; line-height: 1.4; }
    .settings-card { margin: 14px 0 18px; }
    .settings-row {
      display: grid; grid-template-columns: auto 1fr auto; gap: 12px; align-items: center;
      padding: 14px 16px; border-bottom: 1px solid var(--line);
    }
    .settings-row:last-child { border-bottom: 0; }

</head>

    let entries = [];

    const $ = sel => document.querySelector(sel);
    const $$ = sel => Array.from(document.querySelectorAll(sel));

    function clone(obj) { return JSON.parse(JSON.stringify(obj)); }
    function uuid() { return globalThis.crypto?.randomUUID ? globalThis.crypto.randomUUID() : 'id-' + Date.now() + '-' + Math.random().toString(16).slice(2); }

    let dbPromise = null;
    function openDailybugDb() {
      if (!('indexedDB' in window)) return Promise.reject(new Error('IndexedDB is not available'));
      if (dbPromise) return dbPromise;
      dbPromise = new Promise((resolve, reject) => {
        const request = indexedDB.open(DB_NAME, DB_VERSION);
        request.onupgradeneeded = () => {
          const db = request.result;
          if (!db.objectStoreNames.contains(ENTRY_STORE)) {
            const store = db.createObjectStore(ENTRY_STORE, { keyPath: 'id' });
            store.createIndex('event_at', 'event_at', { unique: false });
            store.createIndex('type', 'type', { unique: false });
            store.createIndex('deleted_at', 'deleted_at', { unique: false });
          }
        };
        request.onsuccess = () => resolve(request.result);
        request.onerror = () => reject(request.error || new Error('Unable to open IndexedDB'));
      });
      return dbPromise;
    }

    async function readIndexedEntries() {
      const db = await openDailybugDb();
      return await new Promise((resolve, reject) => {
        const tx = db.transaction(ENTRY_STORE, 'readonly');
        const request = tx.objectStore(ENTRY_STORE).getAll();
        request.onsuccess = () => resolve(Array.isArray(request.result) ? request.result : []);
        request.onerror = () => reject(request.error || new Error('Unable to read IndexedDB entries'));
      });
    }

    async function replaceIndexedEntries(nextEntries) {
      const db = await openDailybugDb();
      await new Promise((resolve, reject) => {
        const tx = db.transaction(ENTRY_STORE, 'readwrite');
        const store = tx.objectStore(ENTRY_STORE);
        store.clear();
        (Array.isArray(nextEntries) ? nextEntries : []).forEach(entry => store.put(entry));
        tx.oncomplete = resolve;
        tx.onerror = () => reject(tx.error || new Error('Unable to save IndexedDB entries'));
        tx.onabort = () => reject(tx.error || new Error('IndexedDB save aborted'));
      });
    }

    function loadLegacyEntries() { try { return JSON.parse(localStorage.getItem(STORAGE_KEY) || '[]'); } catch { return []; } }
    function saveLegacyEntriesBackup(snapshot = entries) { try { localStorage.setItem(STORAGE_KEY, JSON.stringify(snapshot)); } catch (error) { console.warn('Unable to save legacy entries backup', error); } }
    async function loadEntries() {
      try {
        const indexedEntries = await readIndexedEntries();
        if (indexedEntries.length) return indexedEntries;
        const legacyEntries = loadLegacyEntries();
        if (legacyEntries.length) {
          await replaceIndexedEntries(legacyEntries);
          return legacyEntries;
        }
        return [];
      } catch (error) {
        console.warn('IndexedDB unavailable; falling back to legacy localStorage entries', error);
        return loadLegacyEntries();
      }
    }
    function loadSettings() { try { return JSON.parse(localStorage.getItem(SETTINGS_KEY) || '{}'); } catch { return {}; } }
    async function saveEntries() {
      const snapshot = clone(entries);
      try { await replaceIndexedEntries(snapshot); }
      catch (error) { console.warn('Unable to save entries to IndexedDB', error); }
      saveLegacyEntriesBackup(snapshot);

    function nowIso() { return new Date().toISOString(); }

    function formatTime(d) { return d.toLocaleTimeString([], { hour: 'numeric', minute: '2-digit' }); }

    function formatDateInput(d) { return `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`; }

    function emojiToIconKey(value, fallback='star') { return ({ '🍴':'food', '💩':'bm', '✨':'release', '🙂':'mood', '🌙':'sleep', '🏋️':'workout', '⭐':'star', '❤️':'target', '🔥':'sun', '⚡':'check', '📝':'note' })[value] || fallback; }

    function migrateSettings(old) {
      const s = { ...clone(DEFAULT_SETTINGS), ...(old || {}) };
      const byId = new Map(DEFAULT_TYPES.map(t => [t.id, { ...t }]));

      // Carry over old visibility and color settings.
      const oldIdMap = { one:'pee', two:'bm', three:'release', feeling:'mood' };
      const visible = old.visibleLogButtons || {};
      Object.entries(visible).forEach(([id, val]) => {
        const mapped = oldIdMap[id] || id;
        if (byId.has(mapped)) byId.get(mapped).visible = !(val === false || val === 'false');
      });
      const oldColors = old.logTypeColors || {};
      Object.entries(oldColors).forEach(([id, color]) => {
        const mapped = oldIdMap[id] || id;
        if (byId.has(mapped)) byId.get(mapped).color = color;
      });

      let order = Array.isArray(old.quickLogTypes) ? old.quickLogTypes.filter(Boolean).map(x => typeof x === 'string' ? x : x.id) : DEFAULT_TYPES.map(t => t.id);
      order = order.map(id => oldIdMap[id] || id).filter(Boolean);
      const ordered = [];
      order.forEach(id => { if (byId.has(id) && !ordered.some(t => t.id === id)) ordered.push(byId.get(id)); });
      DEFAULT_TYPES.forEach(t => { if (!ordered.some(x => x.id === t.id)) ordered.push(byId.get(t.id)); });

      // Preserve custom types from the old app.
      const custom = (old.customLogTypes || []).filter(t => t && !t.deleted_at).map(t => ({
        id: t.id,
        label: t.label,
        displayAs: t.displayAs || t.display_as || t.label,
        iconKey: normalizeTypeIconKey(t.id, t.iconKey || t.emoji),
        color: t.color || oldColors[t.id] || '#75628c',
        soft: t.soft || '#f2edff',
        builtIn: false,
        visible: !(visible[t.id] === false || visible[t.id] === 'false'),
        created_at: t.created_at || nowIso(),
        updated_at: t.updated_at || nowIso(),
        deleted_at: null
      }));
      custom.forEach(t => { if (!ordered.some(x => x.id === t.id)) ordered.push(t); });

      s.openSections = { ...DEFAULT_SETTINGS.openSections, ...(old.openSections || {}) };
      if (!THEMES[s.themeId]) s.themeId = 'ladybug-light';
      if (!s.supabaseUrl) s.supabaseUrl = DEFAULT_SUPABASE_URL;

      s.customLogTypes = custom;
      s.drinkAmountPills = Array.isArray(old.drinkAmountPills) ? old.drinkAmountPills : s.drinkAmountPills;
      s.drinkTypePills = Array.isArray(old.drinkTypePills) ? old.drinkTypePills : s.drinkTypePills;
      s.foodQuickOptions = Array.isArray(old.foodQuickOptions) ? old.foodQuickOptions : s.foodQuickOptions;
      s.sleepDefaults = { ...DEFAULT_SETTINGS.sleepDefaults, ...(old.sleepDefaults || {}) };
      s.workoutSettings = { ...DEFAULT_SETTINGS.workoutSettings, ...(old.workoutSettings || {}) };
      s.workoutSettings.cardioTypes = Array.isArray(s.workoutSettings.cardioTypes) ? s.workoutSettings.cardioTypes : DEFAULT_SETTINGS.workoutSettings.cardioTypes;
      s.workoutSettings.machines = Array.isArray(s.workoutSettings.machines) ? s.workoutSettings.machines : DEFAULT_SETTINGS.workoutSettings.machines;
      if (!s.featuredSinceType) s.featuredSinceType = 'pee';
      s.quickLogTypes = (s.quickLogTypes || []).filter(Boolean).map(t => ({ ...t, displayAs: t.displayAs || t.display_as || t.label, iconKey: normalizeTypeIconKey(t.id, t.iconKey || t.emoji), soft: t.soft || tint(t.color || '#777') }));
      s.schemaVersion = 5;
      return s;

    function blankEntryFields() {
      return {

        bm_urgent:false, bm_uncomfortable:false, bm_solid:false, bm_loose:false, bm_liquid:false,

    function allTypes() { return (settings.quickLogTypes || clone(DEFAULT_TYPES)).filter(Boolean); }
    function typeMeta(id) {

    function entriesForDate(date) { return visibleEntries().filter(e => dateOnlyLocal(new Date(e.event_at)) === dateOnlyLocal(date)); }

    function formatSinceValue(type) {

    function renderLog() {

      const bits = [];
      const includeNotes = options.includeNotes !== false;
      if (e.type === 'drink') { if (e.drink_amount) bits.push(e.drink_amount); if (e.drink_type) bits.push(e.drink_type); }
      if (e.type === 'food' || e.type === 'food_legacy') { if (Array.isArray(e.food_items)) bits.push(...e.food_items); }
      if (e.type === 'pee') { if (e.pee_urgent) bits.push('urgent'); if (e.pee_pre_activity) bits.push('pre-activity'); if (e.pee_uncomfortable) bits.push('uncomfortable'); if (e.pee_volume_low) bits.push('low'); if (e.pee_volume_standard) bits.push('standard'); if (e.pee_volume_high) bits.push('high'); }
      if (e.type === 'bm') { if (e.bm_urgent) bits.push('urgent'); if (e.bm_uncomfortable) bits.push('uncomfortable'); if (e.bm_solid) bits.push('solid'); if (e.bm_loose) bits.push('loose'); if (e.bm_liquid) bits.push('liquid'); }
      if (e.type === 'mood' && e.mood_rating) bits.push({very_bad:'very bad',bad:'bad',neutral:'neutral',good:'good',great:'great'}[e.mood_rating] || e.mood_rating);
      if (e.type === 'sleep') { if (e.sleep_minutes !== null && e.sleep_minutes !== undefined) bits.push(formatMinutes(e.sleep_minutes)); if (Number(e.sleep_wakeups)) bits.push(`${e.sleep_wakeups} wake-up${Number(e.sleep_wakeups) === 1 ? '' : 's'}`); }
      if (e.type === 'workout') { if (e.workout_cardio_type) bits.push(e.workout_cardio_type); if (e.workout_duration) bits.push(`${e.workout_duration} min`); if (Array.isArray(e.workout_machines) && e.workout_machines.length) bits.push(`${e.workout_machines.length} machine${e.workout_machines.length === 1 ? '' : 's'}`); }
      if (includeNotes && e.notes) bits.push(e.notes);
      return bits.join(' · ') || 'No details';
    }

    function formatMinutes(total) { total = Number(total || 0); const h = Math.floor(total/60); const m = total % 60; return h ? `${h}h ${m}m` : `${m}m`; }

    function openSheet(html) { $('#sheet').innerHTML = `<div class="sheet-handle"></div>${html}`; $('#sheetBackdrop').classList.add('show'); $('#sheet').classList.add('show'); }

    function openEntrySheet(type, eventDate = new Date(), entry = null, options = {}) {
      editingEntryId = entry?.id || null;
      const m = typeMeta(type);
      const isEdit = !!entry;
      const isOldEntry = !!options.oldEntry;
      const title = `${isEdit ? 'Edit ' : isOldEntry ? 'Log Previous ' : ''}${m.label}`;
      const notes = entry?.notes || '';

      const dateTimeFields = showDateTimeFields ? `<div class="section-label">Entry Date & Time</div><div class="inline-grid"><label class="small">Date<input id="entryDateInput" type="date" value="${formatDateInput(eventDate)}"></label><label class="small">Time<input id="entryTimeInput" type="time" value="${formatTimeInput(eventDate)}"></label></div>` : '';
      let body = '';
      if (type === 'drink') body = drinkFields(entry);
      else if (type === 'food' || type === 'food_legacy') body = foodFields(entry);
      else if (type === 'pee') body = peeFields(entry);
      else if (type === 'bm') body = bmFields(entry);
      else if (type === 'mood') body = moodFields(entry);
      else if (type === 'sleep') body = sleepFields(entry);
      else if (type === 'workout') body = workoutFields(entry);
      else body = `<div class="small">Custom log type. Add any details in notes.</div>`;
      openSheet(`
        <div class="sheet-head"><div><div class="sheet-title">${escapeHtml(title)}</div><div class="small">${showDateTimeFields ? 'Choose when this happened' : `${formatDate(eventDate)} · ${formatTime(eventDate)}`} </div></div><button class="icon-btn" onclick="closeSheet()">×</button></div>
        ${dateTimeFields}
        ${body}

        <textarea id="entryNotes" placeholder="Optional notes">${escapeHtml(notes)}</textarea>
        <button class="save-btn" data-action="save-entry" data-type="${escapeHtml(type)}" data-event-iso="${eventDate.toISOString()}">Save Entry</button>
        ${entry ? '<button class="danger-btn" data-action="delete-current-entry">Delete Entry</button>' : ''}

    function drinkFields(entry) {

      return `<div class="section-label">Amount</div><div class="pill-grid">${amounts.map((x,i)=>pill(`drink_amount_${i}`, x, entry?.drink_amount === x)).join('')}</div>

        <div class="section-label">Drink Type</div><div class="pill-grid">${types.map((x,i)=>pill(`drink_type_${i}`, x, entry?.drink_type === x)).join('')}</div>
        <div class="section-label">Custom Drink Type</div><input id="drinkCustomType" placeholder="Example: coffee, tea, smoothie" value="${escapeHtml(entry?.drink_type && !types.includes(entry.drink_type) ? entry.drink_type : '')}">`;

    function foodFields(entry) {

    }
    function peeFields(entry) {
      return `<div class="section-label">Urgency</div><div class="pill-grid">${pill('pee_urgent','Urgent',entry?.pee_urgent)}${pill('pee_pre_activity','Pre-Activity',entry?.pee_pre_activity)}${pill('pee_uncomfortable','Uncomfortable',entry?.pee_uncomfortable)}</div>
        <div class="section-label">Volume</div><div class="pill-grid">${pill('pee_volume_low','Low',entry?.pee_volume_low)}${pill('pee_volume_standard','Standard',entry?.pee_volume_standard)}${pill('pee_volume_high','High',entry?.pee_volume_high)}</div>`;
    }
    function bmFields(entry) {
      const peeOption = entry ? '' : `<div class="section-label">Also Log</div><div class="pill-grid">${pill('bm_with_pee','+Pee',false)}</div><div class="small" style="margin-top:8px;">Adds a separate Pee entry at this same time with the note “With BM.”</div>`;
      return `<div class="section-label">Urgency</div><div class="pill-grid">${pill('bm_urgent','Urgent',entry?.bm_urgent)}${pill('bm_uncomfortable','Uncomfortable',entry?.bm_uncomfortable)}</div>
        <div class="section-label">Consistency</div><div class="pill-grid">${pill('bm_solid','Solid',entry?.bm_solid)}${pill('bm_loose','Loose',entry?.bm_loose)}${pill('bm_liquid','Liquid',entry?.bm_liquid)}</div>
        ${peeOption}`;
    }
    function moodFields(entry) {
      const v = entry?.mood_rating || '';
      const faces = [['very_bad','Very Bad'],['bad','Bad'],['neutral','Neutral'],['good','Good'],['great','Great']];
      return `<div class="section-label">Mood</div><div class="face-grid" id="moodGrid">${faces.map(([id,label])=>`<button type="button" class="face-btn ${v===id?'selected':''}" data-action="select-mood" data-mood="${id}" aria-label="${label}">${iconSvg(moodIconKey(id), 'icon-svg', label)}</button>`).join('')}</div>`;
    }
    function sleepFields(entry) {
      const defaults = settings.sleepDefaults || DEFAULT_SETTINGS.sleepDefaults;
      const start = entry?.sleep_start || defaults.sleepTime || '22:00';
      const end = entry?.sleep_end || defaults.wakeTime || '06:30';
      const wakeups = entry?.sleep_wakeups ?? 0;
      const mins = entry?.sleep_minutes ?? sleepMinutes(start, end);
      return `<div class="section-label">Sleep Window</div><div class="inline-grid"><label class="small">Sleep time<input id="sleepStart" type="time" value="${escapeHtml(start)}"></label><label class="small">Wake time<input id="sleepEnd" type="time" value="${escapeHtml(end)}"></label></div>
        <div class="section-label">Total Sleep</div><div class="inline-grid"><input id="sleepHours" type="number" min="0" step="1" value="${Math.floor(mins/60)}" aria-label="Hours slept"><input id="sleepMinutes" type="number" min="0" max="59" step="1" value="${mins%60}" aria-label="Minutes slept"></div>
        <div class="section-label">Overnight Wake-ups</div><input id="sleepWakeups" type="number" min="0" step="1" value="${escapeHtml(wakeups)}">`;
    }
    function workoutFields(entry) {
      const ws = settings.workoutSettings || DEFAULT_SETTINGS.workoutSettings;
      const machines = Array.isArray(entry?.workout_machines) ? entry.workout_machines : [];
      return `<div class="section-label">Cardio</div>
        <div class="pill-grid">${ws.cardioTypes.map((x,i)=>pill(`cardio_type_${i}`, x, entry?.workout_cardio_type === x)).join('')}</div>
        <div class="section-label">Cardio Details</div>
        <div class="three-col"><input id="workoutDuration" type="number" min="0" placeholder="Minutes" value="${escapeHtml(entry?.workout_duration || '')}"><input id="workoutDistance" placeholder="Distance" value="${escapeHtml(entry?.workout_distance || '')}"><select id="workoutIntensity"><option value="">Intensity</option>${['Easy','Moderate','Hard'].map(x=>`<option ${entry?.workout_intensity===x?'selected':''}>${x}</option>`).join('')}</select></div>
        <div class="section-label">Weight Machines</div>
        <div id="machineRows">${machines.length ? machines.map(machineRow).join('') : ''}</div>
        <button class="secondary-btn" type="button" data-action="add-machine-row">Add Machine</button>`;
    }
    function machineRow(machine={}) {
      const ws = settings.workoutSettings || DEFAULT_SETTINGS.workoutSettings;
      const defaults = lastMachineDefaults(machine.name) || { weight:'', sets: ws.defaultSets || 3, reps: ws.defaultReps || 10 };
      const name = machine.name || '';
      const weight = machine.weight ?? defaults.weight ?? '';
      const sets = machine.sets ?? defaults.sets ?? '';
      const reps = machine.reps ?? defaults.reps ?? '';
      return `<div class="machine-fields" data-machine-row>
        <select data-machine-name><option value="">Machine</option>${ws.machines.map(x=>`<option value="${escapeHtml(x)}" ${name===x?'selected':''}>${escapeHtml(x)}</option>`).join('')}</select>
        <input data-machine-weight type="number" min="0" placeholder="${ws.unit || 'lb'}" value="${escapeHtml(weight)}">
        <input data-machine-sets type="number" min="0" placeholder="Sets" value="${escapeHtml(sets)}">
        <input data-machine-reps type="number" min="0" placeholder="Reps" value="${escapeHtml(reps)}">
        <button class="mini-btn" type="button" data-action="remove-machine-row">×</button>
      </div>`;
    }
    function lastMachineDefaults(name) {
      if (!name || settings.workoutSettings?.prefillLastMachineValues === false) return null;
      for (const e of visibleEntries()) {
        if (e.type !== 'workout' || !Array.isArray(e.workout_machines)) continue;
        const found = e.workout_machines.find(m => m.name === name);
        if (found) return found;
      }
      return null;
    }

    function bindSleepCalculator() {
      const syncFromTimes = () => {
        const start = $('#sleepStart')?.value, end = $('#sleepEnd')?.value;
        if (!start || !end) return;
        const mins = sleepMinutes(start, end);
        $('#sleepHours').value = Math.floor(mins/60);
        $('#sleepMinutes').value = mins % 60;
      };
      $('#sleepStart')?.addEventListener('change', syncFromTimes);
      $('#sleepEnd')?.addEventListener('change', syncFromTimes);
    }
    function sleepMinutes(start, end) {
      const [sh,sm] = String(start || '00:00').split(':').map(Number);
      const [eh,em] = String(end || '00:00').split(':').map(Number);
      let a = sh*60 + sm, b = eh*60 + em;
      if (b <= a) b += 24*60;
      return Math.max(0, b-a);
    }

    function saveEntry(type, eventIso) {
      const now = nowIso();
      const resolvedEventIso = entryDateTimeIso(eventIso);
      const old = editingEntryId ? entries.find(e => e.id === editingEntryId) : null;
      const base = { ...(old || {}), ...blankEntryFields(), id: editingEntryId || uuid(), type, type_label: typeLabel(type), entry_schema_v5: true, event_at:resolvedEventIso, created_at: old?.created_at || now, updated_at: now, notes: $('#entryNotes')?.value || '', sync_status:'pending', deleted_at:null };
      if (type === 'drink') {
        const amountCustom = ($('#drinkCustomAmount')?.value || '').trim();
        const typeCustom = ($('#drinkCustomType')?.value || '').trim();
        const amount = amountCustom || (settings.drinkAmountPills || []).find((_,i)=>selected(`drink_amount_${i}`)) || '';
        const dType = typeCustom || (settings.drinkTypePills || []).find((_,i)=>selected(`drink_type_${i}`)) || '';
        base.drink_amount = amount; base.drink_type = dType;
      }
      if (type === 'food' || type === 'food_legacy') base.food_items = (settings.foodQuickOptions || []).filter((_,i)=>selected(`food_item_${i}`));
      if (type === 'pee') Object.assign(base, { pee_urgent:selected('pee_urgent'), pee_pre_activity:selected('pee_pre_activity'), pee_uncomfortable:selected('pee_uncomfortable'), pee_volume_low:selected('pee_volume_low'), pee_volume_standard:selected('pee_volume_standard'), pee_volume_high:selected('pee_volume_high') });
      if (type === 'bm') Object.assign(base, { bm_urgent:selected('bm_urgent'), bm_uncomfortable:selected('bm_uncomfortable'), bm_solid:selected('bm_solid'), bm_loose:selected('bm_loose'), bm_liquid:selected('bm_liquid') });
      if (type === 'mood') base.mood_rating = $('#moodGrid .face-btn.selected')?.dataset.mood || null;
      if (type === 'sleep') {
        base.sleep_start = $('#sleepStart')?.value || ''; base.sleep_end = $('#sleepEnd')?.value || '';
        base.sleep_minutes = (Number($('#sleepHours')?.value || 0) * 60) + Number($('#sleepMinutes')?.value || 0);
        base.sleep_wakeups = Number($('#sleepWakeups')?.value || 0);
      }
      if (type === 'workout') {
        base.workout_cardio_type = (settings.workoutSettings.cardioTypes || []).find((_,i)=>selected(`cardio_type_${i}`)) || '';
        base.workout_duration = $('#workoutDuration')?.value || ''; base.workout_distance = $('#workoutDistance')?.value || ''; base.workout_intensity = $('#workoutIntensity')?.value || '';
        base.workout_machines = $$('[data-machine-row]').map(row => ({ name: row.querySelector('[data-machine-name]').value, weight: row.querySelector('[data-machine-weight]').value, sets: row.querySelector('[data-machine-sets]').value, reps: row.querySelector('[data-machine-reps]').value })).filter(m => m.name || m.weight || m.sets || m.reps);
      }
      const shouldCreateLinkedPee = type === 'bm' && !editingEntryId && selected('bm_with_pee');
      if (editingEntryId) entries = entries.map(e => e.id === editingEntryId ? base : e); else entries.push(base);
      if (shouldCreateLinkedPee) entries.push(createLinkedPeeEntry(resolvedEventIso, now));
      saveEntries(); closeSheet(); render(); toast(shouldCreateLinkedPee ? 'BM + Pee saved' : 'Saved'); autoBackupPending();
    }
    function createLinkedPeeEntry(eventIso, now) {
      return {
        ...blankEntryFields(),
        id: uuid(),
        type: 'pee',
        type_label: typeLabel('pee'),
        entry_schema_v5: true,
        event_at: eventIso,
        created_at: now,
        updated_at: now,
        notes: 'With BM',
        sync_status: 'pending',
        deleted_at: null
      };
    }
    function deleteEntry(id) { if (!id) return; if (!confirm('Delete this entry?')) return; entries = entries.map(e => e.id === id ? { ...e, deleted_at: nowIso(), updated_at: nowIso(), sync_status:'pending' } : e); saveEntries(); closeSheet(); render(); toast('Deleted'); autoBackupPending(); }

      const source = includeDeleted ? entries.slice() : visibleEntries().slice();
      if (range === 'all') return source;
      const days = Number(range);
      if (!days) return source;

    function exportCsv(range = 'all') {

    function exportAiAnalysisCsv(range = 'all') {
      const rows = entriesForExport(range).sort((a,b) => new Date(a.event_at) - new Date(b.event_at));
      const cols = ['local_date','local_time','day_of_week','hour_bucket','entry_type','summary','details','notes','minutes_since_previous_entry','minutes_since_previous_same_type','entries_so_far_today','same_type_count_so_far_today','daily_total_entries','daily_pee_count','event_at','id'];
      const dayTotals = new Map();
      rows.forEach(e => {
        const key = dateOnlyLocal(new Date(e.event_at));
        const current = dayTotals.get(key) || { total: 0, pee: 0 };
        current.total += 1;
        if (e.type === 'pee') current.pee += 1;
        dayTotals.set(key, current);
      });
      const seenByDay = new Map();
      const seenTypeByDay = new Map();
      const lastByType = new Map();
      let previous = null;
      const csvRows = rows.map(e => {
        const d = new Date(e.event_at);
        const dayKey = dateOnlyLocal(d);
        const typeKey = dayKey + '|' + e.type;
        const detailText = describeEntry(e, { includeNotes: false });
        const cleanDetails = detailText === 'No details' ? '' : detailText;
        const entriesSoFar = (seenByDay.get(dayKey) || 0) + 1;
        const sameTypeSoFar = (seenTypeByDay.get(typeKey) || 0) + 1;
        seenByDay.set(dayKey, entriesSoFar);
        seenTypeByDay.set(typeKey, sameTypeSoFar);
        const previousSameType = lastByType.get(e.type) || null;
        const row = {
          local_date: dayKey,
          local_time: formatTime(d),
          day_of_week: d.toLocaleDateString([], { weekday: 'long' }),
          hour_bucket: hourBucket(d),
          entry_type: typeLabel(e.type),
          summary: typeLabel(e.type) + (cleanDetails ? ': ' + cleanDetails : ''),
          details: cleanDetails,
          notes: e.notes || '',
          minutes_since_previous_entry: previous ? Math.round((d - new Date(previous.event_at)) / 60000) : '',
          minutes_since_previous_same_type: previousSameType ? Math.round((d - new Date(previousSameType.event_at)) / 60000) : '',
          entries_so_far_today: entriesSoFar,
          same_type_count_so_far_today: sameTypeSoFar,
          daily_total_entries: dayTotals.get(dayKey)?.total || '',
          daily_pee_count: dayTotals.get(dayKey)?.pee || 0,
          event_at: e.event_at,
          id: e.id
        };
        previous = e;
        lastByType.set(e.type, e);
        return row;
      });
      const csv = [cols.join(',')].concat(csvRows.map(row => cols.map(c => csvEscape(row[c])).join(','))).join('\n');
      downloadBlob(csv, `dailybug_ai_analysis_${exportRangeLabel(range)}_${dateOnlyLocal(new Date())}.csv`, 'text/csv;charset=utf-8'); toast('AI export created');
    }

    function hourBucket(date) {
      const h = date.getHours();
      if (h < 4) return 'overnight';
      if (h < 12) return 'morning';
      if (h < 17) return 'afternoon';
      if (h < 21) return 'evening';
      return 'night';
    }

    function csvEscape(v) { if (v == null) return ''; const s = String(v); return /[",\n]/.test(s) ? '"' + s.replace(/"/g,'""') + '"' : s; }
    function exportJson(range = 'all') {

      downloadBlob(JSON.stringify({ version:5, exported_at:nowIso(), export_range: exportRangeLabel(range), entries: scopedEntries, settings }, null, 2), `dailybug_backup_${exportRangeLabel(range)}_${dateOnlyLocal(new Date())}.json`, 'application/json'); toast('JSON exported');
    }

        function parseCsv(text) {
      const rows = [];
      let row = [], field = '', inQuotes = false;
      const src = String(text || '').replace(/^\uFEFF/, '');
      for (let i = 0; i < src.length; i++) {
        const ch = src[i], next = src[i + 1];
        if (inQuotes) {
          if (ch === '"' && next === '"') { field += '"'; i++; }
          else if (ch === '"') inQuotes = false;
          else field += ch;
        } else if (ch === '"') inQuotes = true;
        else if (ch === ',') { row.push(field); field = ''; }
        else if (ch === '\n') { row.push(field); rows.push(row); row = []; field = ''; }
        else if (ch !== '\r') field += ch;
      }
      if (field || row.length) { row.push(field); rows.push(row); }
      if (!rows.length) return [];
      const headers = rows.shift().map(h => h.trim());
      return rows.filter(r => r.some(v => String(v).trim() !== '')).map(r => Object.fromEntries(headers.map((h, i) => [h, r[i] ?? ''])));
    }

    function csvBool(value) {
      if (value === true || value === false) return value;
      const v = String(value ?? '').trim().toLowerCase();
      return v === 'true' || v === '1' || v === 'yes';
    }

    function csvArray(value) {
      const v = String(value ?? '').trim();
      if (!v) return [];
      if (v.startsWith('[')) { try { const parsed = JSON.parse(v); return Array.isArray(parsed) ? parsed : [v]; } catch {} }
      return v.split('|').map(x => x.trim()).filter(Boolean);
    }

    function normalizeCsvEntry(row) {
      const boolFields = ['one_urgent','one_pre_activity','one_uncomfortable','one_volume_low','one_volume_standard','one_volume_high','two_urgent','two_uncomfortable','two_solid','two_loose','two_liquid','is_backdated'];
      const out = { ...row };
      boolFields.forEach(k => out[k] = csvBool(out[k]));
      out.deleted_at = String(out.deleted_at || '').trim() || null;
      out.notes = out.notes || '';
      out.sync_status = out.sync_status || 'pending';
      out.food_items = csvArray(out.food_items);
      out.type_label = out.type_label || out.type_current_label || out.type_label_at_entry || '';
      return out;
    }

    function applyCsvCustomTypes(rows) {
      const builtIn = new Set(DEFAULT_TYPES.map(t => t.id).concat(['one','two','three','feeling','food','food_legacy','drink','pee','bm','release','mood','sleep','workout']));
      rows.forEach(row => {
        const id = row.type;
        if (!id || builtIn.has(id) || settings.quickLogTypes.some(t => t.id === id)) return;
        const label = row.type_current_label || row.type_label_at_entry || id;
        const color = row.custom_type_color || '#75628c';
        const t = { id, label, displayAs: label, iconKey: 'star', color, soft: tint(color), builtIn: false, visible: true, created_at: nowIso(), updated_at: nowIso(), deleted_at: row.custom_type_deleted_at || null };
        if (!t.deleted_at) settings.quickLogTypes.push(t);
        settings.customLogTypes.push(t);
      });
    }

    function importJson() {
      const input = document.createElement('input');
      input.type = 'file';
      input.accept = '.json,.csv,application/json,text/csv';
      input.onchange = () => {
        const file = input.files?.[0];
        if (!file) return;
        const r = new FileReader();
        r.onload = async () => {
          const raw = String(r.result || '');
          try {
            if (raw.trim().startsWith('{')) {
              const p = JSON.parse(raw);
              if (!Array.isArray(p.entries)) throw new Error('Missing entries');
              if (!confirm('Import this JSON backup? This replaces local entries and settings.')) return;
              entries = migrateEntries(p.entries);
              settings = migrateSettings(p.settings || {});
            } else {
              const rows = parseCsv(raw);
              if (!rows.length || !('type' in rows[0]) || !('event_at' in rows[0])) throw new Error('Unsupported CSV');
              if (!confirm(`Import ${rows.length} CSV rows? This replaces local entries but keeps your current settings.`)) return;
              applyCsvCustomTypes(rows);
              entries = migrateEntries(rows.map(normalizeCsvEntry));
            }
            await saveEntries(); saveSettings(); render(); toast('Imported');
          } catch (err) {
            toast(err.message === 'Unsupported CSV' ? 'Unsupported CSV' : 'Import failed');
          }
        };
        r.readAsText(file);
      };
      input.click();
    }
    function downloadBlob(data, filename, type) { const blob=new Blob([data],{type}); const url=URL.createObjectURL(blob); const a=document.createElement('a'); a.href=url; a.download=filename; document.body.appendChild(a); a.click(); a.remove(); URL.revokeObjectURL(url); }
    async function clearData() {
      if(!confirm('Clear all local entries?')) return;
      entries=[];
      try { localStorage.removeItem(STORAGE_KEY); } catch {}
      await saveEntries();
      render();
      toast('Cleared');
    }

    function getSupabaseClient() {
      const url = normalizeSupabaseUrl(settings.supabaseUrl || DEFAULT_SUPABASE_URL);
      const key = settings.supabaseAnonKey || DEFAULT_SUPABASE_ANON_KEY;
      if (!url || !key || !window.supabase) return null;
      return window.supabase.createClient(url, key);
    }
    function saveCloudSettings() {
      settings.supabaseUrl = normalizeSupabaseUrl($('#supabaseUrl')?.value.trim() || DEFAULT_SUPABASE_URL);
      settings.supabaseAnonKey = $('#supabaseAnonKey')?.value.trim() || DEFAULT_SUPABASE_ANON_KEY;
      saveSettings();
      toast('Cloud settings saved');
    }
    function normalizeSupabaseUrl(url) {
      return String(url || '').trim().replace(/\/rest\/v1\/?$/i, '').replace(/\/+$/g, '');
    }
    function cloudDiagnosticHtml(lines) {
      return `<div class="section-label">Connection Test</div><div class="panel" style="padding:14px;margin-top:10px;">${lines.map(line => `<div class="small" style="margin:6px 0;">${line}</div>`).join('')}</div>`;
    }
    async function testSupabaseConnection() {
      saveCloudSettings();
      const cleanedUrl = normalizeSupabaseUrl(settings.supabaseUrl);
      if (cleanedUrl !== settings.supabaseUrl) {
        settings.supabaseUrl = cleanedUrl;
        const input = $('#supabaseUrl');
        if (input) input.value = cleanedUrl;
        saveSettings();
      }

      const lines = [];
      const setResults = () => {
        const target = $('#supabaseTestResults');
        if (target) target.innerHTML = cloudDiagnosticHtml(lines);
      };
      const addLine = (ok, text) => {
        lines.push(`${ok ? '✅' : '❌'} ${escapeHtml(text)}`);
        setResults();
      };

      if (!settings.supabaseUrl) { addLine(false, 'Missing Supabase URL.'); toast('Missing Supabase URL'); return; }
      if (!/^https:\/\/[a-z0-9-]+\.supabase\.co$/i.test(settings.supabaseUrl)) {
        addLine(false, 'URL should look like https://project-ref.supabase.co with no extra path.');
        toast('Invalid Supabase URL');
        return;
      }
      addLine(true, 'URL format looks valid.');

      if (!settings.supabaseAnonKey) { addLine(false, 'Missing publishable/anon key.'); toast('Missing Supabase key'); return; }
      if (!/^sb_publishable_|^eyJ/.test(settings.supabaseAnonKey)) {
        addLine(false, 'Key does not look like a publishable or anon public key.');
        toast('Check Supabase key');
        return;
      }
      addLine(true, 'Key format looks valid.');

      const client = getSupabaseClient();
      if (!client) { addLine(false, 'Could not create Supabase client.'); toast('Client setup failed'); return; }
      addLine(true, 'Supabase client created.');

      try {
        let { data, error } = await client.auth.getUser();
        const sessionMissing = error && String(error.message || '').toLowerCase().includes('session missing');
        if (error && !sessionMissing) {
          addLine(false, `Current user check failed: ${error.message}`);
          toast(error.message);
          return;
        }
        addLine(true, data?.user ? 'Existing Supabase user session found.' : 'No existing session found; trying anonymous sign-in.');

        if (!data?.user) {
          const result = await client.auth.signInAnonymously();
          if (result.error || !result.data?.user) {
            addLine(false, `Anonymous sign-in failed: ${result.error?.message || 'No user returned.'}`);
            toast(result.error?.message || 'Anonymous sign-in failed');
            return;
          }
          data = result.data;
          addLine(true, 'Anonymous sign-in succeeded.');
        }

        const tableCheck = await client.from('entries').select('id', { count: 'exact', head: true }).limit(1);
        if (tableCheck.error) {
          addLine(false, `Entries table/RLS check failed: ${tableCheck.error.message}`);
          toast(tableCheck.error.message);
          return;
        }
        addLine(true, 'Entries table is reachable with current user/RLS policy.');
        toast('Supabase test passed');
      } catch (error) {
        const message = error?.message || String(error);
        addLine(false, `Network/client error: ${message}`);
        toast(message);
      }
    }
    function entryToSupabaseRow(e, userId) {
      return {
        id: e.id,
        user_id: userId,
        type: e.type || null,
        type_label: e.type_label || null,
        entry_schema_v5: !!e.entry_schema_v5,
        event_at: e.event_at || null,
        created_at: e.created_at || null,
        updated_at: e.updated_at || null,
        notes: e.notes || null,

        drink_amount: e.drink_amount || null,
        drink_type: e.drink_type || null,
        food_items: Array.isArray(e.food_items) ? e.food_items : [],

        pee_urgent: !!e.pee_urgent,
        pee_pre_activity: !!e.pee_pre_activity,
        pee_uncomfortable: !!e.pee_uncomfortable,
        pee_volume_low: !!e.pee_volume_low,
        pee_volume_standard: !!e.pee_volume_standard,
        pee_volume_high: !!e.pee_volume_high,

        bm_urgent: !!e.bm_urgent,
        bm_uncomfortable: !!e.bm_uncomfortable,
        bm_solid: !!e.bm_solid,
        bm_loose: !!e.bm_loose,
        bm_liquid: !!e.bm_liquid,

        mood_rating: e.mood_rating || e.feeling_rating || null,

        sleep_start: e.sleep_start || null,
        sleep_end: e.sleep_end || null,
        sleep_minutes: e.sleep_minutes === '' || e.sleep_minutes === undefined || e.sleep_minutes === null ? null : Number(e.sleep_minutes),
        sleep_wakeups: e.sleep_wakeups === '' || e.sleep_wakeups === undefined || e.sleep_wakeups === null ? null : Number(e.sleep_wakeups),

        workout_cardio_type: e.workout_cardio_type || null,
        workout_duration: e.workout_duration || null,
        workout_distance: e.workout_distance || null,
        workout_intensity: e.workout_intensity || null,
        workout_machines: Array.isArray(e.workout_machines) ? e.workout_machines : [],

        sync_status: e.sync_status || null,
        deleted_at: e.deleted_at || null
      };
    }

    async function backupNow() {
      saveCloudSettings(); settings.supabaseUrl = normalizeSupabaseUrl(settings.supabaseUrl); saveSettings(); const client=getSupabaseClient(); if(!client){ toast('Add Supabase settings first'); return; }
      let { data, error: userError } = await client.auth.getUser();
      if(userError && !String(userError.message || '').toLowerCase().includes('session missing')){
        toast(userError.message);
        console.warn('Supabase user check failed', userError);
        return;
      }
      if(!data?.user){
        const { data: anonData, error: anonError } = await client.auth.signInAnonymously();
        if(anonError || !anonData?.user){
          const message = anonError?.message || 'Could not sign in to Supabase';
          toast(message);
          console.warn('Supabase anonymous sign-in failed', anonError);
          return;
        }
        data = anonData;
      }
      const payload = entries.map(e => entryToSupabaseRow(e, data.user.id));
      const { error } = await client.from('entries').upsert(payload, { onConflict:'id' });
      if(error) toast(error.message); else { entries=entries.map(e=>({...e,sync_status:'synced'})); settings.lastSyncAt=nowIso(); await saveEntries(); saveSettings(); toast('Backup complete'); }
    }
    async function autoBackupPending() { if (!settings.supabaseUrl || !settings.supabaseAnonKey || !navigator.onLine) return; try { await backupNow(); } catch {} }

    function toast(msg) { const t=$('#toast'); t.textContent=msg; t.classList.add('show'); setTimeout(()=>t.classList.remove('show'),1700); }

    const ACTIONS = {
      'log-now': el => openEntrySheet(el.dataset.type, new Date()),
      'log-old': el => openEntrySheet(el.dataset.type, new Date(), null, { showDateTime: true, oldEntry: true }),
      'add-note': () => openEntrySheet('note', new Date()),
      'toggle-recent-entries': () => { recentEntriesCollapsed = !recentEntriesCollapsed; renderLog(); },
      'edit-entry': el => { const e = entries.find(x => x.id === el.dataset.id); if (e) openEntrySheet(e.type, new Date(e.event_at), e); },
      'toggle-pill': el => el.classList.toggle('selected'),
      'select-mood': el => { $$('#moodGrid .face-btn').forEach(b => b.classList.remove('selected')); el.classList.add('selected'); },
      'save-entry': el => saveEntry(el.dataset.type, el.dataset.eventIso),
      'delete-current-entry': () => deleteEntry(editingEntryId),
      'delete-entry': el => deleteEntry(el.dataset.id),
      'add-machine-row': () => $('#machineRows').insertAdjacentHTML('beforeend', machineRow({})),
      'remove-machine-row': el => el.closest('[data-machine-row]')?.remove(),
      'toggle-section': el => { settings.openSections = settings.openSections || {}; settings.openSections[el.dataset.id] = !settings.openSections[el.dataset.id]; saveSettings(); renderSettings(); },
      'edit-log-type': el => openLogTypeEditor(el.dataset.id),
      'toggle-log-type': el => toggleLogType(el.dataset.id),
      'move-log-type': el => moveLogType(el.dataset.index, el.dataset.direction),
      'choose-icon-key': el => { $('#iconKeyInput').value = el.dataset.iconKey; $$('.icon-choice').forEach(btn => btn.classList.remove('selected')); el.classList.add('selected'); },
      'save-log-type-editor': el => saveLogTypeEditor(el.dataset.id),
      'archive-custom-type': el => {
        const t = settings.quickLogTypes.find(x => x.id === el.dataset.id);
        if (!t || t.builtIn) return;
        t.deleted_at = nowIso();
        settings.quickLogTypes = settings.quickLogTypes.filter(x => x.id !== t.id);
        settings.customLogTypes = settings.customLogTypes.filter(x => x.id !== t.id);
        saveSettings(); closeSheet(); renderSettings();
      },
      'add-custom-log-type': addCustomLogType,
      'add-quick-option': el => addQuickOption(el.dataset.key, el.dataset.placeholder),
      'move-quick-option': el => moveQuickOption(el.dataset.key, el.dataset.index, el.dataset.direction),
      'remove-quick-option': el => removeQuickOption(el.dataset.key, el.dataset.index),
      'save-sleep-defaults': () => { settings.sleepDefaults = { sleepTime: $('#defaultSleepTime').value, wakeTime: $('#defaultWakeTime').value }; saveSettings(); toast('Sleep defaults saved'); },
      'add-machine-setting': () => addQuickOption('workoutSettings.machines','Add machine name'),
      'toggle-prefill-machines': () => { settings.workoutSettings.prefillLastMachineValues = !(settings.workoutSettings.prefillLastMachineValues !== false); saveSettings(); renderSettings(); },
      'save-workout-defaults': () => { settings.workoutSettings.defaultSets = Number($('#defaultSets').value || 0); settings.workoutSettings.defaultReps = Number($('#defaultReps').value || 0); settings.workoutSettings.unit = $('#workoutUnit').value; saveSettings(); toast('Workout defaults saved'); },
      'save-featured-timer': () => { settings.featuredSinceType = $('#featuredSinceType')?.value || 'pee'; saveSettings(); render(); toast('Featured timer saved'); },
      'save-theme': el => saveTheme(el.dataset.themeId),
      'summary-day': el => changeSummaryDay(el.dataset.direction),
      'month': el => changeMonth(el.dataset.direction),
      'current-month': goToCurrentMonth,
      'current-summary-day': goToCurrentSummaryDay,
      'calendar-mode': el => { calendarMode = el.dataset.mode || 'pees'; renderCalendar(); },
      'calendar-year-picker': openCalendarYearPicker,
      'pick-calendar-year': el => openCalendarMonthPicker(el.dataset.year),
      'pick-calendar-month': el => { viewedMonth = new Date(Number(el.dataset.year), Number(el.dataset.month), 1); closeSheet(); renderCalendar(); },
      'summary-year-picker': openSummaryYearPicker,
      'pick-summary-year': el => openSummaryMonthPicker(el.dataset.year),
      'pick-summary-month': el => openSummaryDayPicker(el.dataset.year, el.dataset.month),
      'pick-summary-day': el => { summaryViewedDate = new Date(Number(el.dataset.year), Number(el.dataset.month), Number(el.dataset.day), 12); closeSheet(); renderSummary(); },
      'open-day': el => openDay(el.dataset.date),
      'view-summary-date': el => viewSummaryDate(el.dataset.date),
      'open-export-picker': openExportFormatPicker,
      'pick-export-format': el => openExportRangePicker(el.dataset.format),
      'run-export': el => runExport(el.dataset.format, el.dataset.range),
      'export-csv': el => exportCsv(el?.dataset.range || 'all'),
      'export-json': el => exportJson(el?.dataset.range || 'all'),
      'import-json': importJson,
      'clear-data': clearData,
      'save-cloud-settings': saveCloudSettings,
      'test-supabase-connection': testSupabaseConnection,
      'backup-now': backupNow
    };

    let quickLongPressTimer = null;
    let quickLongPressTarget = null;
    let ignoreQuickClickUntil = 0;
    function clearQuickLongPress() {
      if (quickLongPressTimer) clearTimeout(quickLongPressTimer);
      quickLongPressTimer = null;
      quickLongPressTarget?.classList.remove('long-pressing');
      quickLongPressTarget = null;
    }
    document.addEventListener('pointerdown', (event) => {
      const el = event.target.closest('[data-long-press-action]');
      if (!el || (event.pointerType === 'mouse' && event.button !== 0)) return;
      quickLongPressTarget = el;
      el.classList.add('long-pressing');
      quickLongPressTimer = setTimeout(() => {
        const action = el.dataset.longPressAction;
        ignoreQuickClickUntil = Date.now() + 900;
        clearQuickLongPress();
        ACTIONS[action]?.(el);
        try { navigator.vibrate?.(12); } catch {}
      }, 650);
    }, { passive: true });
    ['pointerup','pointercancel','pointerleave','scroll'].forEach(name => document.addEventListener(name, clearQuickLongPress, { passive: true }));
    document.addEventListener('contextmenu', (event) => {
      if (event.target.closest('[data-long-press-action]')) event.preventDefault();
    });

    document.addEventListener('click', (event) => {
      if (Date.now() < ignoreQuickClickUntil) { event.preventDefault(); event.stopPropagation(); return; }
      const navTarget = event.target.closest('[data-nav-target]');
      if (navTarget) { activeTab = navTarget.dataset.navTarget; render(); return; }
      const navBtn = event.target.closest('.nav button');
      if (navBtn) { activeTab = navBtn.dataset.nav; render(); return; }
      const el = event.target.closest('[data-action]');
      ACTIONS[el?.dataset.action]?.(el);
    });

    // Initialize app state after icon/theme helpers are available, then persist one-time migrations immediately.
    async function initApp() {
      try {
        settings = migrateSettings(loadSettings());
        entries = migrateEntries(await loadEntries());
        applyTheme(settings.themeId);
        await saveEntries();
        saveSettings();
        render();
      } catch (error) {
        console.error('Dailybug failed to start', error);
        const app = document.querySelector('.app');
        if (app) {
          app.innerHTML = `<div class="panel" style="padding:18px;margin-top:24px;"><div class="section-title">Dailybug couldn’t start</div><div class="small" style="margin-top:8px;">The app hit a startup error while reading saved data. This usually means saved local settings from an older file are incompatible, or browser storage is unavailable.</div><button class="danger-btn" onclick="localStorage.removeItem('${SETTINGS_KEY}'); location.reload();">Reset Settings and Reload</button></div>`;
        }
      }
    }
    initApp();
  </script>
</body>
