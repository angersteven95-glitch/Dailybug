    }
    function moveFoodQuickOption(index, direction) {
      settings.foodQuickOptions = settings.foodQuickOptions || [];
      const from = Number(index);
      const to = from + Number(direction);
      if (Number.isNaN(from) || Number.isNaN(to) || to < 0 || to >= settings.foodQuickOptions.length) return;
      const [item] = settings.foodQuickOptions.splice(from, 1);
      settings.foodQuickOptions.splice(to, 0, item);
      saveSettings();
      renderSettings();
      toast('Quick option moved');
    }

    function removeFoodQuickOption(index) {
      settings.foodQuickOptions = settings.foodQuickOptions || [];
      const i = Number(index);
      if (Number.isNaN(i) || i < 0 || i >= settings.foodQuickOptions.length) return;
      settings.foodQuickOptions.splice(i, 1);
      saveSettings(); renderSettings(); toast('Quick option removed');
    }

    function saveCloudSettings() {
      settings.supabaseUrl = $('#supabaseUrl').value.trim();
      settings.supabaseAnonKey = $('#supabaseAnonKey').value.trim();
      settings.syncEmail = $('#syncEmail')?.value.trim() || settings.syncEmail || '';
      saveSettings(); updateSyncChip(); renderSettings(); toast('Cloud settings saved');
    }
    async function requireSupabase() {
      const client = getSupabaseClient();
      if (!client) { toast('Add Supabase settings first'); return null; }
      return client;
    }
    function readLoginFields() {
      settings.syncEmail = $('#syncEmail')?.value.trim() || settings.syncEmail || '';
      saveSettings();
      return { email: settings.syncEmail, password: $('#syncPassword')?.value || '' };
    }
    async function signUpCloud() {
      saveCloudSettings();
      const client = await requireSupabase(); if (!client) return;
      const { email, password } = readLoginFields();
      if (!email || !password) { toast('Enter email and password'); return; }
      const { error } = await client.auth.signUp({ email, password });
      if (error) toast(error.message); else toast('Sign-up sent/successful');
    }
    async function signInCloud() {
      saveCloudSettings();
      const client = await requireSupabase(); if (!client) return;
      const { email, password } = readLoginFields();
      if (!email || !password) { toast('Enter email and password'); return; }
      const { error } = await client.auth.signInWithPassword({ email, password });
      if (error) toast(error.message); else { toast('Signed in'); await backupNow(); }
    }
    async function signOutCloud() {
      const client = await requireSupabase(); if (!client) return;
      await client.auth.signOut(); toast('Signed out');
    }
    function cloudPayload(entry, userId) {
      return {
        id: entry.id,
        user_id: userId,
        type: entry.type,
        event_at: entry.event_at,
        created_at: entry.created_at,
        updated_at: entry.updated_at,
        is_backdated: !!entry.is_backdated,
        notes: entry.notes || '',
        one_urgent: !!entry.one_urgent,
        one_uncomfortable: !!entry.one_uncomfortable,
        one_volume_low: !!entry.one_volume_low,
        one_volume_standard: !!entry.one_volume_standard,
        one_volume_high: !!entry.one_volume_high,
        two_urgent: !!entry.two_urgent,
        two_uncomfortable: !!entry.two_uncomfortable,
        two_solid: !!entry.two_solid,
        two_loose: !!entry.two_loose,
        two_liquid: !!entry.two_liquid,
        feeling_rating: entry.feeling_rating || null,
        food_items: Array.isArray(entry.food_items) ? entry.food_items.join('|') : '',
        sync_status: 'synced',
        deleted_at: entry.deleted_at || null
      };
    }
    async function getCloudUser(client) {
      const { data, error } = await client.auth.getUser();
      if (error || !data?.user) { toast('Sign in first'); return null; }
      return data.user;
    }
    async function backupNow() {
      const client = await requireSupabase(); if (!client) return;
      const user = await getCloudUser(client); if (!user) return;
      if (!entries.length) { toast('No local entries to backup'); return; }
      const payload = entries.map(e => cloudPayload(e, user.id));
      let { error } = await client.from('entries').upsert(payload, { onConflict: 'id' });
      if (error && String(error.message || '').includes('food_items')) {
        const fallback = payload.map(({ food_items, ...rest }) => rest);
        const retry = await client.from('entries').upsert(fallback, { onConflict: 'id' });
        error = retry.error;
      }
      if (error) { toast(error.message); return; }
      entries = entries.map(e => ({ ...e, sync_status: 'synced' }));
      settings.lastSyncAt = nowIso(); saveSettings(); saveEntries(); render(); toast('Backup complete');
    }
    async function autoBackupPending() {
      const pending = entries.some(e => e.sync_status === 'pending');
      if (!pending || !settings.supabaseUrl || !settings.supabaseAnonKey || !navigator.onLine) return;
      try { await backupNow(); } catch (e) { console.warn(e); }
    }
    async function downloadFromCloud() {
      const client = await requireSupabase(); if (!client) return;
      const user = await getCloudUser(client); if (!user) return;
      const { data, error } = await client.from('entries').select('*').eq('user_id', user.id);
      if (error) { toast(error.message); return; }
      const byId = new Map(entries.map(e => [e.id, e]));
      for (const remote of (data || [])) {
        const local = byId.get(remote.id);
        if (!local || new Date(remote.updated_at) > new Date(local.updated_at || 0)) {
          byId.set(remote.id, { ...blankEntryFields(), ...remote, food_items: Array.isArray(remote.food_items) ? remote.food_items : (remote.food_items ? String(remote.food_items).split('|').filter(Boolean) : []), sync_status: 'synced' });
        }
      }
      entries = Array.from(byId.values());
      settings.lastSyncAt = nowIso(); saveSettings(); saveEntries(); render(); toast('Cloud data merged');
    }



    function exportJsonBackup() {
      const payload = {
        version: 1,
        exported_at: nowIso(),
        entries,
        settings
      };
      const blob = new Blob([JSON.stringify(payload, null, 2)], { type: 'application/json;charset=utf-8' });
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url;
      a.download = `tracker_backup_${dateOnlyLocal(new Date())}.json`;
      document.body.appendChild(a); a.click(); a.remove(); URL.revokeObjectURL(url);
      toast('JSON backup exported');
    }
    function importJsonBackup() {
      const input = document.createElement('input');
      input.type = 'file';
      input.accept = 'application/json,.json';
      input.onchange = () => {
        const file = input.files && input.files[0];
        if (!file) return;
        const reader = new FileReader();
        reader.onload = () => {
          try {
            const payload = JSON.parse(String(reader.result || '{}'));
            if (!Array.isArray(payload.entries)) throw new Error('Missing entries array');
            if (!confirm('Import this JSON backup? This will replace current local entries and settings.')) return;
            entries = payload.entries;
            settings = Object.assign({}, payload.settings || {});
            settings.visibleLogButtons = Object.assign({ one: true, two: true, three: true, food: true, feeling: true }, settings.visibleLogButtons || {});
            settings.customLogTypes = settings.customLogTypes || [];
            settings.appColors = settings.appColors || {};
            settings.dailyNotes = settings.dailyNotes || {};
            if (settings.showLogScreenLabels === undefined) settings.showLogScreenLabels = false;
            if (settings.showLogElapsedSincePrevious === undefined) settings.showLogElapsedSincePrevious = true;
            if (!settings.colorTheme) settings.colorTheme = 'dark';
            saveSettings();
            saveEntries();
            applyAppColors();
            render();
            toast('JSON backup imported');
          } catch (err) {
            toast('Invalid JSON backup');
          }
        };
        reader.readAsText(file);
      };
      input.click();
    }

    function csvEscape(value) {
      if (value === null || value === undefined) return '';
      const s = String(value);
      if (/[",\n]/.test(s)) return '"' + s.replace(/"/g, '""') + '"';
      return s;
    }
    function exportCsvPreset(preset='all') {
      const now = new Date();
      let start = null;
      if (preset === 'year') {
        start = new Date(now); start.setFullYear(start.getFullYear() - 1);
      } else if (preset === '30') {
        start = new Date(now); start.setDate(start.getDate() - 30);
      } else if (preset === '7') {
        start = new Date(now); start.setDate(start.getDate() - 7);
      }
      exportCsv({ start, label: preset });
    }

    function exportCsv(options={}) {
      const start = options.start || null;
      const label = options.label || 'all';
      let data = [...visibleEntries()].sort((a,b)=> new Date(a.event_at)-new Date(b.event_at));
      if (start) data = data.filter(e => new Date(e.event_at) >= start);
      const cols = ['id','type','type_label_at_entry','type_current_label','custom_type_deleted_at','custom_type_color','event_at','created_at','updated_at','is_backdated','notes','one_urgent','one_pre_activity','one_uncomfortable','one_volume_low','one_volume_standard','one_volume_high','two_urgent','two_uncomfortable','two_solid','two_loose','two_liquid','feeling_rating','food_items','sync_status','deleted_at'];
      const csv = [cols.join(',')].concat(data.map(row => cols.map(c => {
        if (c === 'type_label_at_entry') return csvEscape(row.type_label || typeLabel(row.type));
        if (c === 'type_current_label') return csvEscape(typeLabel(row.type));
        if (c === 'custom_type_deleted_at') {
          const custom = (settings.customLogTypes || []).find(x => x.id === row.type);
          return csvEscape(custom?.deleted_at || row.type_deleted_at || '');
        }
        if (c === 'custom_type_color') {
          const custom = (settings.customLogTypes || []).find(x => x.id === row.type);
          return csvEscape(logTypeColor(row.type) || '');
        }
        return csvEscape(Array.isArray(row[c]) ? row[c].join('|') : row[c]);
      }).join(','))).join('\n');
      const blob = new Blob([csv], { type: 'text/csv;charset=utf-8' });
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url;
      a.download = `tracker_export_${label}_${dateOnlyLocal(new Date())}.csv`;
      document.body.appendChild(a); a.click(); a.remove(); URL.revokeObjectURL(url);
      toast('CSV exported');
    }

    function seedDemoData() {
      const now = new Date();
      const demo = [];
      for (let i=0;i<24;i++) {
        const d = new Date(now); d.setDate(now.getDate() - Math.floor(i/3)); d.setHours(7 + (i%5)*3, Math.floor(Math.random()*50), 0, 0);
        demo.push({ ...blankEntryFields(), id: uuid(), type: 'one', event_at: d.toISOString(), created_at: nowIso(), updated_at: nowIso(), is_backdated: false, notes: '', one_volume_standard: true, sync_status: 'pending', deleted_at: null });
      }
      entries.push(...demo); saveEntries(); render(); toast('Demo data added');
    }
    function clearAllData() {
      if (!confirm('Clear all local data?')) return;
      entries = []; saveEntries(); render(); toast('Cleared');
    }
    function toast(msg) {
      const t = $('#toast'); t.textContent = msg; t.classList.add('show');
      setTimeout(()=>t.classList.remove('show'), 1700);
    }
    function escapeHtml(str) {
      return String(str || '').replace(/[&<>'"]/g, ch => ({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[ch]));
    }

    window.addEventListener('online', autoBackupPending);

    document.addEventListener('click', (event) => {
      const actionEl = event.target.closest('[data-action]');
      if (!actionEl) return;
      const { action, type } = actionEl.dataset;
      if (action === 'log-now') openEntrySheet(type, new Date(), false);
      if (action === 'log-previous') openBackdateSheet(type);
      if (action === 'add-custom-log-type') addCustomLogType();
      if (action === 'add-food-quick-option') addFoodQuickOption();
      if (action === 'move-food-quick-option') moveFoodQuickOption(actionEl.dataset.index, actionEl.dataset.direction);
      if (action === 'remove-food-quick-option') removeFoodQuickOption(actionEl.dataset.index);
    });

    $$('.nav button').forEach(btn => btn.addEventListener('click', () => { activeTab = btn.dataset.nav; render(); }));

    // Lightweight offline-friendly behavior: this single file runs without internet once opened/saved.
    // True PWA install/service worker needs separate hosted files or a generated blob worker, so cloud/PWA sync is intentionally scaffolded.
    applyAppColors();
    render();
  </script>
</body>
</html>
