<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#111111" />
  <title>Log</title>
  <style>
    :root {
      --bg: #101010;
      --panel: #171717;
      --panel-2: #202020;
      --panel-3: #292929;
      --text: #eeeeee;
      --muted: #a7a7a7;
      --faint: #6f6f6f;
      --line: #333333;
      --accent: #c17f32;
      --accent-2: #e4a85b;
      --green: #4f8f5b;
      --orange: #b66d2f;
      --red: #a84444;
      --one: #80683d;
      --one-soft: #5b4b31;
      --two: #5a4a3f;
      --two-soft: #453a33;
      --three: #bfc2c4;
      --three-soft: #74787b;
      --food: #7f9a77;
      --food-soft: #556b50;
      --feeling: #343434;
      --radius: 22px;
      --shadow: 0 14px 35px rgba(0,0,0,.35);
      --safe-bottom: env(safe-area-inset-bottom, 0px);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    }

    * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
    body {
      margin: 0;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      overflow-x: hidden;
    }

    button, input, textarea, select { font: inherit; }
    button { cursor: pointer; border: 0; }
    textarea, input, select {
      width: 100%;
      background: var(--input-bg, #111);
      color: var(--text);
      border: 1px solid var(--line);
      border-radius: 16px;
      padding: 14px;
      outline: none;
    }
    textarea { min-height: 110px; resize: vertical; }

    .app {
      width: 100%;
      max-width: 520px;
      margin: 0 auto;
      min-height: 100vh;
      padding: 18px 16px calc(90px + var(--safe-bottom));
    }

    header.top {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 8px 2px 18px;
    }
    .title { font-size: 30px; font-weight: 750; letter-spacing: -0.04em; }
    .sync-chip {
      color: var(--muted);
      background: var(--panel);
      border: 1px solid var(--line);
      border-radius: 999px;
      padding: 8px 11px;
      font-size: 12px;
    }

    .screen { display: none; }
    .screen.active { display: block; }

    .counter {
      color: var(--muted);
      font-size: 14px;
      margin: 14px 8px 8px;
      letter-spacing: .01em;
    }

    .tracker-card {
      height: 98px;
      border-radius: var(--radius);
      overflow: hidden;
      display: grid;
      grid-template-columns: 1fr 2fr;
      box-shadow: var(--shadow);
      border: 1px solid rgba(255,255,255,.06);
      margin-bottom: 10px;
    }
    .tracker-card.full { grid-template-columns: 1fr; }
    .track-part {
      min-width: 0;
      color: rgba(255,255,255,.9);
      display: flex;
      align-items: center;
      justify-content: center;
      position: relative;
      transition: filter .12s ease, transform .12s ease;
    }
    .track-part:active { filter: brightness(1.18); transform: scale(.992); }
    .track-part.left { border-right: 1px solid rgba(255,255,255,.16); }
    .track-part.right::after, .track-part.fullbtn::after {
      content: "";
      position: absolute;
      inset: 0;
      background: linear-gradient(135deg, rgba(255,255,255,.10), rgba(255,255,255,0));
      pointer-events: none;
    }
    .card-one .left { background: var(--one-soft); }
    .card-one .right { background: var(--one); }
    .card-two .left { background: var(--two-soft); }
    .card-two .right { background: var(--two); }
    .card-three .left { background: var(--three-soft); color: #111; }
    .card-three .right { background: var(--three); color: #111; }
    .card-food .left { background: var(--food-soft); }
    .card-food .right { background: var(--food); color: #101010; }
    .card-feeling .fullbtn { background: var(--feeling); }

    .tracker-card.log-colored {
      background: var(--custom-log-color);
      color: var(--custom-log-text, #f4f4f4);
      border-color: var(--custom-log-color);
    }
    .tracker-card.log-colored .track-part {
      background: transparent !important;
      color: inherit !important;
    }
    .tracker-card.log-colored .track-part.left {
      background: rgba(0,0,0,.14) !important;
      border-right-color: rgba(255,255,255,.22);
    }
    .tracker-card.log-colored .track-part.right::after,
    .tracker-card.log-colored .track-part.fullbtn::after {
      display: none;
    }
    body.theme-outline .tracker-card.log-colored {
      background: transparent !important;
      color: var(--custom-log-color) !important;
      border: 2px solid var(--custom-log-color);
      box-shadow: none;
    }
    body.theme-outline .tracker-card.log-colored .track-part.left {
      background: transparent !important;
      border-right-color: var(--custom-log-color);
    }
    body.theme-outline .tracker-card.log-colored .track-now-label {
      opacity: .78;
      color: var(--custom-log-color);
    }

    .rewind-icon { width: 34px; height: 34px; opacity: .88; }
    .track-now-label { font-size: 13px; font-weight: 700; opacity: .34; letter-spacing: .08em; text-transform: uppercase; }

    .nav {
      position: fixed;
      bottom: 0;
      left: 50%;
      transform: translateX(-50%);
      width: 100%;
      max-width: 520px;
      padding: 10px 12px calc(10px + var(--safe-bottom));
      background: var(--nav-bg);
      backdrop-filter: blur(14px);
      border-top: 1px solid rgba(255,255,255,.06);
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 8px;
      z-index: 50;
    }
    .nav button {
      color: var(--muted);
      background: transparent;
      border-radius: 16px;
      padding: 10px 5px;
      font-size: 12px;
      font-weight: 650;
    }
    .nav button.active { color: #111; background: var(--accent-2); }

    .panel {
      background: var(--panel);
      border: 1px solid var(--line);
      border-radius: var(--radius);
      padding: 16px;
      box-shadow: var(--shadow);
      margin: 12px 0;
    }
    .panel h2, .panel h3 { margin: 0 0 12px; letter-spacing: -0.02em; }
    .panel h2 { font-size: 22px; }
    .panel h3 { font-size: 17px; color: var(--text); }
    .small { color: var(--muted); font-size: 13px; line-height: 1.4; }

    .sheet-backdrop {
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,.58);
      opacity: 0;
      pointer-events: none;
      transition: opacity .16s ease;
      z-index: 80;
    }
    .sheet-backdrop.show { opacity: 1; pointer-events: auto; }
    .sheet {
      position: fixed;
      left: 50%;
      bottom: 0;
      transform: translate(-50%, 110%);
      width: 100%;
      max-width: 520px;
      max-height: 90vh;
      overflow: auto;
      background: var(--panel);
      color: var(--text);
      border-radius: 28px 28px 0 0;
      border: 1px solid var(--line);
      padding: 12px 16px calc(18px + var(--safe-bottom));
      z-index: 90;
      transition: transform .2s ease;
      box-shadow: 0 -20px 60px rgba(0,0,0,.55);
    }
    .sheet.show { transform: translate(-50%, 0); }
    .sheet-handle { width: 48px; height: 5px; border-radius: 99px; background: var(--line); margin: 2px auto 16px; }
    .sheet-head { display: flex; justify-content: space-between; gap: 10px; align-items: center; margin-bottom: 12px; }
    .sheet-title { font-size: 24px; font-weight: 750; letter-spacing: -0.03em; }
    .icon-btn {
      background: var(--panel-2);
      color: var(--text);
      border: 1px solid var(--line);
      border-radius: 999px;
      width: 42px;
      height: 42px;
      font-size: 20px;
    }
    .section-label { color: var(--muted); margin: 18px 0 10px 2px; font-size: 13px; font-weight: 700; text-transform: uppercase; letter-spacing: .08em; }
    .pill-grid { display: flex; flex-wrap: wrap; gap: 10px; }
    .pill {
      background: var(--panel-2);
      color: var(--text);
      border: 1px solid var(--line);
      border-radius: 999px;
      padding: 12px 15px;
      font-size: 15px;
      font-weight: 650;
    }
    .pill.selected { background: var(--accent-2); color: #111; border-color: var(--accent-2); }

    .feeling-scale {
      display: grid;
      grid-template-columns: repeat(5, 1fr);
      gap: 10px;
      margin-top: 4px;
    }
    .face-btn {
      height: 58px;
      border-radius: 18px;
      background: var(--panel-2);
      border: 1px solid var(--line);
      display: flex;
      align-items: center;
      justify-content: center;
      transition: transform .12s ease, background .12s ease, border-color .12s ease;
    }
    .face-btn:active { transform: scale(.96); }
    .face-btn svg { width: 34px; height: 34px; stroke-width: 2.35; fill: none; }
    .face-btn.selected { background: rgba(255,255,255,.08); transform: scale(1.04); }
    .face-btn.selected svg { stroke-width: 2.9; }
    .face-red { color: #b84b4b; }
    .face-orange { color: #c47a36; }
    .face-yellow { color: #c9a84b; }
    .face-pale-green { color: #9dbc73; }
    .face-green { color: #5fa66a; }
    .face-red.selected { border-color: #b84b4b; box-shadow: 0 0 0 2px rgba(184,75,75,.16); }
    .face-orange.selected { border-color: #c47a36; box-shadow: 0 0 0 2px rgba(196,122,54,.16); }
    .face-yellow.selected { border-color: #c9a84b; box-shadow: 0 0 0 2px rgba(201,168,75,.16); }
    .face-pale-green.selected { border-color: #9dbc73; box-shadow: 0 0 0 2px rgba(157,188,115,.16); }
    .face-green.selected { border-color: #5fa66a; box-shadow: 0 0 0 2px rgba(95,166,106,.16); }

    .face-btn svg, .feeling-face svg { overflow: visible; }
    .feeling-face {
      width: 34px;
      height: 34px;
      border-radius: 999px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      vertical-align: middle;
      position: relative;
      flex: 0 0 auto;
    }
    .feeling-face svg { width: 34px; height: 34px; stroke-width: 2.8; fill: none; }
    .feeling-face.small { width: 28px; height: 28px; }
    .feeling-face.small svg { width: 28px; height: 28px; stroke-width: 2.6; }
    .feeling-face.large { width: 42px; height: 42px; }
    .feeling-face.large svg { width: 42px; height: 42px; stroke-width: 2.9; }
    .feeling-split {
      width: 34px;
      height: 34px;
      display: inline-grid;
      grid-template-columns: 1fr 1fr;
      overflow: hidden;
      border-radius: 999px;
      vertical-align: middle;
      flex: 0 0 auto;
    }
    .feeling-split .half {
      width: 17px;
      height: 34px;
      overflow: hidden;
      position: relative;
    }
    .feeling-split .half svg { width: 34px; height: 34px; stroke-width: 2.8; fill: none; }
    .feeling-split .right svg { transform: translateX(-17px); }
    .feeling-split.small { width: 28px; height: 28px; }
    .feeling-split.small .half { width: 14px; height: 28px; }
    .feeling-split.small .half svg { width: 28px; height: 28px; stroke-width: 2.6; }
    .feeling-split.small .right svg { transform: translateX(-14px); }
    .feeling-day-badge {
      margin: auto auto 0;
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 34px;
    }
    .calendar-toggle {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 8px;
      margin: 10px 0 12px;
      background: var(--panel);
      border: 1px solid var(--line);
      border-radius: 16px;
      padding: 4px;
    }
    .calendar-toggle button {
      background: transparent;
      color: var(--muted);
      border-radius: 12px;
      padding: 10px;
      font-weight: 850;
      font-size: 13px;
    }
    .calendar-toggle button.active { background: var(--panel-3); color: var(--text); }
    .day-title-row { display: flex; align-items: center; gap: 10px; }
    .save-btn, .secondary-btn, .danger-btn {
      width: 100%;
      border-radius: 18px;
      padding: 15px;
      font-weight: 800;
      margin-top: 16px;
    }
    .save-btn { background: var(--accent-2); color: #111; }
    .secondary-btn { background: var(--panel-2); color: var(--text); border: 1px solid var(--line); }
    .danger-btn { background: rgba(168,68,68,.18); color: #ffb3b3; border: 1px solid rgba(168,68,68,.45); }
    .two-col { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }

    .month-head { display: grid; grid-template-columns: 1fr auto auto; align-items: center; gap: 8px; margin: 8px 0 12px; }
    .month-title { font-size: 22px; font-weight: 750; letter-spacing: -0.03em; background: transparent; color: var(--text); border: 0; padding: 8px 0; text-align: left; min-width: 0; }
    .month-title:active { opacity: .75; }
    .today-btn { border-radius: 999px; background: var(--panel-2); color: var(--muted); border: 1px solid var(--line); padding: 8px 10px; font-weight: 800; font-size: 12px; white-space: nowrap; }
    .year-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
    .year-btn, .month-btn { background: var(--panel-2); color: var(--text); border: 1px solid var(--line); border-radius: 14px; padding: 13px 8px; font-weight: 800; }
    .year-btn.active, .month-btn.active { background: var(--accent-2); color: #111; border-color: var(--accent-2); }
    .arrow-row { display: flex; gap: 8px; }
    .arrow-row button { width: 42px; height: 42px; border-radius: 14px; background: var(--panel-2); color: var(--text); border: 1px solid var(--line); font-size: 20px; }
    .dow, .calendar-grid { display: grid; grid-template-columns: repeat(7, 1fr); gap: 6px; }
    .dow div { color: var(--faint); text-align: center; font-size: 11px; font-weight: 800; padding: 5px 0; }
    .day {
      min-height: 58px;
      background: var(--panel);
      border: 1px solid #272727;
      border-radius: 15px;
      padding: 6px;
      display: flex;
      flex-direction: column;
      align-items: flex-start;
      gap: 5px;
    }
    .day.empty { opacity: .25; }
    .day.today { background: var(--today-bg, #d8d8d8); border-color: #eeeeee; color: #111; }
    .day.today .date-num { color: #111; font-weight: 900; }
    .date-num { font-size: 12px; color: var(--muted); }
    .badge {
      width: 30px;
      height: 30px;
      border-radius: 10px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: 850;
      font-size: 13px;
      margin: auto auto 0;
    }
    .badge.low { background: #050505; color: white; border: 1px solid #333; }
    .badge.mid { background: var(--green); color: white; }
    .badge.high { background: var(--orange); color: white; }
    .badge.max { background: var(--red); color: white; }
    .legend { display: flex; align-items: center; justify-content: space-around; gap: 10px; margin-top: 12px; background: var(--panel); border: 1px solid var(--line); border-radius: 18px; padding: 10px; }
    .legend-item { color: var(--muted); font-size: 11px; text-align: center; background: transparent; border: 0; border-radius: 0; padding: 0; }

    .stat-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
    .stat {
      background: var(--panel);
      border: 1px solid var(--line);
      border-radius: 18px;
      padding: 14px;
    }
    .stat .value { font-size: 25px; font-weight: 850; letter-spacing: -0.04em; }
    .stat .label { color: var(--muted); font-size: 12px; margin-top: 4px; }
    .list { display: flex; flex-direction: column; gap: 8px; }
    .entry-row {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      gap: 12px;
      background: var(--panel-2);
      border: 1px solid var(--line);
      border-radius: 16px;
      padding: 12px;
    }
    .entry-main { min-width: 0; }
    .entry-title { font-weight: 800; }
    .entry-sub { color: var(--muted); font-size: 12px; margin-top: 3px; overflow-wrap: anywhere; }
    .row-actions { display: flex; gap: 8px; }
    .mini-btn { background: var(--panel-2); color: var(--text); border: 1px solid var(--line); border-radius: 12px; padding: 8px 10px; font-size: 12px; }
    .add-btn { width: 42px; height: 42px; border-radius: 14px; padding: 0; display: inline-flex; align-items: center; justify-content: center; font-size: 24px; line-height: 1; font-weight: 800; background: var(--panel-2); color: var(--text); border: 1px solid var(--line); flex: 0 0 auto; }
    .mini-btn.danger { color: #ffb3b3; }
    .mini-btn:disabled { opacity: .38; cursor: default; }
    .quick-option-row { align-items: center; }
    .quick-option-label { min-width: 0; overflow-wrap: anywhere; font-weight: 700; }
    .quick-option-actions { display: flex; align-items: center; gap: 6px; flex: 0 0 auto; }
    .quick-move-btn { min-width: 36px; padding: 8px 0; font-size: 15px; font-weight: 900; }


    .legend-item.low-key::before,
    .legend-item.mid-key::before,
    .legend-item.high-key::before,
    .legend-item.max-key::before {
      content: "";
      display: block;
      width: 24px;
      height: 24px;
      border-radius: 8px;
      margin: 0 auto 6px;
      border: 1px solid rgba(255,255,255,.18);
    }
    .legend-item.low-key::before { background: #050505; }
    .legend-item.mid-key::before { background: var(--green); }
    .legend-item.high-key::before { background: var(--orange); }
    .legend-item.max-key::before { background: var(--red); }

    .entry-row.type-one { background: linear-gradient(135deg, var(--one-soft), rgba(91,75,49,.35)); border-color: rgba(128,104,61,.8); }
    .entry-row.type-two { background: linear-gradient(135deg, var(--two-soft), rgba(69,58,51,.35)); border-color: rgba(90,74,63,.85); }
    .entry-row.type-three { background: linear-gradient(135deg, var(--three-soft), rgba(116,120,123,.28)); border-color: rgba(191,194,196,.55); }
    .entry-row.type-feeling { background: linear-gradient(135deg, #343434, rgba(52,52,52,.35)); border-color: rgba(120,120,120,.4); }
    .entry-row.type-food { background: linear-gradient(135deg, var(--food-soft), rgba(85,107,80,.35)); border-color: rgba(127,154,119,.75); }
    .entry-row.type-three .entry-title, .entry-row.type-three .entry-sub { color: #f2f2f2; }
    .entry-labels { color: var(--muted); font-size: 12px; margin-top: 3px; font-style: italic; overflow-wrap: anywhere; }
    .entry-note { color: var(--muted); font-size: 12px; margin-top: 5px; overflow-wrap: anywhere; white-space: pre-wrap; }

    .food-details {
      color: var(--muted);
      font-size: 12px;
      margin-top: 3px;
      font-style: normal;
      overflow-wrap: anywhere;
    }
    .timeline { margin-top: 14px; display: flex; flex-direction: column; gap: 8px; }
    .timeline-row { display: grid; grid-template-columns: 72px 1fr; gap: 10px; align-items: start; background: var(--panel); border: 1px solid var(--line); border-radius: 16px; padding: 11px; }
    .timeline-time { color: var(--muted); font-size: 12px; font-weight: 800; }
    .timeline-main { font-size: 13px; }

    .summary-day-head {
      display: grid;
      grid-template-columns: 1fr auto auto auto auto;
      align-items: center;
      gap: 8px;
      margin-bottom: 10px;
    }
    .summary-day-title h2 { margin-bottom: 2px; }
    .summary-day-head .today-btn { margin: 0; }
    .summary-day-head .arrow-row { flex: 0 0 auto; }
    .settings-section { margin-bottom: 12px; overflow: hidden; }
    .settings-section h2 { margin: 0; }
    .settings-header { width: 100%; display: flex; justify-content: space-between; align-items: center; background: transparent; color: var(--text); padding: 0; text-align: left; }
    .settings-body { display: none; margin-top: 12px; }
    .settings-section.open .settings-body { display: block; }
    .chev { color: var(--muted); font-size: 18px; }
    .sync-form { display: grid; gap: 10px; margin-top: 12px; }
    .sync-form label { color: var(--muted); font-size: 12px; font-weight: 700; text-transform: uppercase; letter-spacing: .07em; }
    .sync-actions { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }

    .settings-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 10px;
      padding: 14px 0;
      border-bottom: 1px solid var(--line);
    }
    .settings-row:last-child { border-bottom: 0; }

    .toggle-row { cursor: pointer; }

    button.toggle-switch {
      padding: 0;
      min-width: 48px;
      cursor: pointer;
    }
    .toggle-switch {
      width: 48px;
      height: 28px;
      border-radius: 999px;
      background: #2b2b2b;
      border: 1px solid var(--line);
      position: relative;
      flex: 0 0 auto;
      transition: background .16s ease, border-color .16s ease;
    }
    .toggle-switch::after {
      content: '';
      position: absolute;
      width: 22px;
      height: 22px;
      border-radius: 50%;
      background: #9a9a9a;
      top: 2px;
      left: 2px;
      transition: transform .16s ease, background .16s ease;
    }
    .toggle-switch.on {
      background: rgba(196,122,54,.24);
      border-color: rgba(196,122,54,.75);
    }
    .toggle-switch.on::after {
      transform: translateX(20px);
      background: var(--accent-2);
    }

    .visible-log-card {
      width: 100%;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 14px;
      background: var(--panel-2);
      color: var(--text);
      border: 1px solid var(--line);
      border-radius: 20px;
      padding: 15px 16px;
      margin-top: 10px;
      text-align: left;
      box-shadow: inset 0 1px 0 rgba(255,255,255,.035);
    }
    .visible-log-card strong {
      font-size: 15px;
      letter-spacing: -.01em;
    }
    .visible-log-card .small {
      margin-top: 3px;
    }
    .visible-log-card:active {
      transform: scale(.99);

<body>
  <main class="app">
    <header class="top">
      <div class="title" id="pageTitle">Log</div>
      <div class="sync-chip" id="syncChip">local</div>
    </header>

    <section id="logScreen" class="screen active"></section>
    <section id="calendarScreen" class="screen"></section>
    <section id="summaryScreen" class="screen"></section>
    <section id="settingsScreen" class="screen"></section>
  </main>

  <nav class="nav">
    <button data-nav="log" class="active">Log</button>
    <button data-nav="calendar">Calendar</button>
    <button data-nav="summary">Summary</button>
    <button data-nav="settings">Settings</button>
  </nav>

  <div id="sheetBackdrop" class="sheet-backdrop"></div>
  <div id="sheet" class="sheet"></div>
  <div id="toast" class="toast"></div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script>
    const STORAGE_KEY = 'discreet_tracker_entries_v1';
    const SETTINGS_KEY = 'discreet_tracker_settings_v1';

    let entries = loadEntries();
    let settings = loadSettings();
    settings.visibleLogButtons = Object.assign({ one: true, two: true, three: true, food: true, feeling: true }, settings.visibleLogButtons || {});
    settings.customLogTypes = settings.customLogTypes || [];
    settings.appColors = settings.appColors || {};
    settings.dailyNotes = settings.dailyNotes || {};
    if (settings.showLogScreenLabels === undefined) settings.showLogScreenLabels = false;
    if (settings.showLogElapsedSincePrevious === undefined) settings.showLogElapsedSincePrevious = true;
    if (!settings.colorTheme) settings.colorTheme = 'dark';
    let activeTab = 'log';
    let viewedMonth = new Date();
    let summaryViewedDate = new Date();
    let calendarMode = 'pees';
    let editingEntryId = null;
    let entryIndexCache = null;

    const $ = (sel) => document.querySelector(sel);
    const $$ = (sel) => Array.from(document.querySelectorAll(sel));

    function uuid() {
      if (crypto && crypto.randomUUID) return crypto.randomUUID();
      return 'id-' + Date.now() + '-' + Math.random().toString(16).slice(2);
    }

    function loadEntries() {
      try { return JSON.parse(localStorage.getItem(STORAGE_KEY) || '[]'); }
      catch { return []; }
    }
    function loadSettings() {
      try { return JSON.parse(localStorage.getItem(SETTINGS_KEY) || '{}'); }
      catch { return {}; }
    }
    function saveSettings() {
      localStorage.setItem(SETTINGS_KEY, JSON.stringify(settings));
    }
    function getSupabaseClient() {
      if (!settings.supabaseUrl || !settings.supabaseAnonKey || !window.supabase) return null;
      return window.supabase.createClient(settings.supabaseUrl, settings.supabaseAnonKey);
    }
    function saveEntries() {
      invalidateEntryIndex();
      localStorage.setItem(STORAGE_KEY, JSON.stringify(entries));
      updateSyncChip();
    }
    function updateSyncChip() {
      const pending = entries.filter(e => e.sync_status === 'pending').length;
      const connected = !!(settings.supabaseUrl && settings.supabaseAnonKey);
      $('#syncChip').textContent = pending ? `${pending} pending` : (connected ? 'cloud ready' : 'local');
    }

    function nowIso() { return new Date().toISOString(); }
    function pad(n) { return String(n).padStart(2, '0'); }
    function toLocalInputValue(d) {
      return `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}T${pad(d.getHours())}:${pad(d.getMinutes())}`;
    }
    function dateOnlyLocal(d) { return `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`; }
    function formatTime(d) {
      return d.toLocaleTimeString([], { hour: 'numeric', minute: '2-digit' });
    }
    function formatDate(d) {
      return d.toLocaleDateString([], { month: 'short', day: 'numeric', year: 'numeric' });
    }
    function startOfTrackingDay(date = new Date()) {
      const d = new Date(date);
      const start = new Date(d.getFullYear(), d.getMonth(), d.getDate(), 4, 0, 0, 0);
      if (d < start) start.setDate(start.getDate() - 1);
      return start;
    }
    function endOfTrackingDay(date = new Date()) {
      const s = startOfTrackingDay(date);
      const e = new Date(s);
      e.setDate(e.getDate() + 1);
      return e;
    }
    function isInTrackingDay(iso, baseDate) {
      const d = new Date(iso);
      const s = startOfTrackingDay(baseDate);
      const e = endOfTrackingDay(baseDate);
      return d >= s && d < e;
    }
    function trackingDayKey(date) {
      return dateOnlyLocal(startOfTrackingDay(date));
    }
    function invalidateEntryIndex() {
      entryIndexCache = null;
    }
    function getEntryIndex() {
      if (entryIndexCache) return entryIndexCache;
      const visible = entries.filter(e => !e.deleted_at);
      const byType = {};
      const byTrackingDay = {};
      visible.forEach(e => {
        (byType[e.type] ||= []).push(e);
        const d = new Date(e.event_at);
        if (!Number.isNaN(d.getTime())) (byTrackingDay[trackingDayKey(d)] ||= []).push(e);
      });
      Object.values(byType).forEach(list => list.sort((a,b) => new Date(a.event_at) - new Date(b.event_at)));
      Object.values(byTrackingDay).forEach(list => list.sort((a,b) => new Date(a.event_at) - new Date(b.event_at)));
      entryIndexCache = { visible, byType, byTrackingDay };
      return entryIndexCache;
    }
    function visibleEntries() { return getEntryIndex().visible; }
    function entriesOfType(type) { return getEntryIndex().byType[type] || []; }
    function entriesForTrackingDay(date) { return getEntryIndex().byTrackingDay[trackingDayKey(date)] || []; }
    function latestEntry(type) {
      const list = entriesOfType(type);
      return list.length ? list[list.length - 1] : null;
    }
    function formatSince(type) {
      const last = latestEntry(type);
      if (!last) return '—';
      const hours = (Date.now() - new Date(last.event_at).getTime()) / 36e5;
      if (hours < 24) return `${Math.max(0, hours).toFixed(1)}h`;
      return `${Math.max(0, hours / 24).toFixed(1)}d`;
    }
    function oneCountToday() {
      return entriesForTrackingDay(new Date()).filter(e => e.type === 'one').length;
    }
    function feelingStatusToday() {
      return entriesForTrackingDay(new Date()).some(e => e.type === 'feeling') ? 'logged' : 'not yet logged';
    }
    function typeLabel(t) {
      const builtIn = { one: 'Pee', two: 'Poop', three: 'Release', food: 'Food/Drink', feeling: 'Feeling' };
      if (builtIn[t]) return builtIn[t];
      const custom = (settings.customLogTypes || []).find(x => x.id === t);
      return custom?.label || t;
    }
    function isCustomType(type) {
      return (settings.customLogTypes || []).some(x => x.id === type);
    }
    function activeCustomTypes() {
      return (settings.customLogTypes || []).filter(x => !x.deleted_at);
    }
    const CUSTOM_LOG_COLORS = [
      { name: 'Sage', value: '#6f8f73' },
      { name: 'Slate', value: '#6f7f8f' },
      { name: 'Mauve', value: '#8d6f86' },
      { name: 'Clay', value: '#9a6f5f' },
      { name: 'Amber', value: '#a88a52' },
      { name: 'Olive', value: '#7f8757' },
      { name: 'Teal', value: '#5f8b86' },
      { name: 'Graphite', value: '#777777' },
      { name: 'Dusty Blue', value: '#607d9a' },
      { name: 'Muted Rose', value: '#9a6670' },
      { name: 'Deep Plum', value: '#75628c' },
      { name: 'Moss', value: '#5f8060' }
    ];
    const DEFAULT_LOG_TYPE_COLORS = {
      one: '#80683d',
      two: '#5a4a3f',
      three: '#bfc2c4',
      food: '#7f9a77',
      feeling: '#343434'
    };
    const COLOR_THEMES = {
      dark: {
        label: 'Dark',
        description: 'Current dark charcoal look with solid log cards.',
        colors: {
          bg: '#101010', panel: '#171717', panel2: '#202020', panel3: '#292929',
          text: '#eeeeee', muted: '#a7a7a7', faint: '#6f6f6f', line: '#333333',
          accent: '#c17f32', accent2: '#e4a85b', green: '#4f8f5b', orange: '#b66d2f', red: '#a84444',
          navBg: '#161616', inputBg: '#111111', todayBg: '#d8d8d8'
        },
        outline: false
      },
      light: {
        label: 'Light',
        description: 'Soft warm white and light gray interface with solid log cards.',
        colors: {
          bg: '#efeee9', panel: '#f8f7f3', panel2: '#e7e4dc', panel3: '#d8d4ca',
          text: '#171717', muted: '#67635c', faint: '#8a857d', line: '#cbc6bc',
          accent: '#b77a34', accent2: '#d69a48', green: '#4f8f5b', orange: '#b66d2f', red: '#a84444',
          navBg: '#ebe8e1', inputBg: '#fbfaf6', todayBg: '#ffffff'
        },
        outline: false
      },
      darkOutline: {
        label: 'Dark outline',
        description: 'Dark interface with log and entry cards outlined in each log type color.',
        colors: {
          bg: '#101010', panel: '#171717', panel2: '#202020', panel3: '#292929',
          text: '#eeeeee', muted: '#a7a7a7', faint: '#6f6f6f', line: '#333333',
          accent: '#c17f32', accent2: '#e4a85b', green: '#4f8f5b', orange: '#b66d2f', red: '#a84444',
          navBg: '#161616', inputBg: '#111111', todayBg: '#d8d8d8'
        },
        outline: true
      },
      lightOutline: {
        label: 'Light outline',
        description: 'Light interface with log and entry cards outlined in each log type color.',
        colors: {
          bg: '#efeee9', panel: '#f8f7f3', panel2: '#e7e4dc', panel3: '#d8d4ca',
          text: '#171717', muted: '#67635c', faint: '#8a857d', line: '#cbc6bc',
          accent: '#b77a34', accent2: '#d69a48', green: '#4f8f5b', orange: '#b66d2f', red: '#a84444',
          navBg: '#ebe8e1', inputBg: '#fbfaf6', todayBg: '#ffffff'
        },
        outline: true
      }
    };
    const COLOR_VAR_MAP = {
      bg: '--bg', panel: '--panel', panel2: '--panel-2', panel3: '--panel-3', text: '--text',
      muted: '--muted', faint: '--faint', line: '--line', accent: '--accent', accent2: '--accent-2',
      green: '--green', orange: '--orange', red: '--red'
    };
    function currentTheme() {
      return COLOR_THEMES[settings.colorTheme] || COLOR_THEMES.dark;
    }
    function appColor(key) {
      return currentTheme().colors[key] || COLOR_THEMES.dark.colors[key] || '#777777';
    }
    function applyAppColors() {
      const root = document.documentElement;
      const theme = currentTheme();
      const colors = theme.colors;
      Object.entries(COLOR_VAR_MAP).forEach(([key, cssVar]) => root.style.setProperty(cssVar, colors[key]));
      root.style.setProperty('--nav-bg', colors.navBg);
      root.style.setProperty('--input-bg', colors.inputBg);
      root.style.setProperty('--today-bg', colors.todayBg);
      root.style.setProperty('--one', logTypeColor('one'));
      root.style.setProperty('--two', logTypeColor('two'));
      root.style.setProperty('--three', logTypeColor('three'));
      root.style.setProperty('--food', logTypeColor('food'));
      root.style.setProperty('--feeling', logTypeColor('feeling'));
      document.body.classList.toggle('theme-outline', !!theme.outline);
      document.body.classList.toggle('theme-light', settings.colorTheme === 'light' || settings.colorTheme === 'lightOutline');
    }

    function customTypeById(type) {
      return (settings.customLogTypes || []).find(x => x.id === type);
    }
    function defaultTypeColor(type) {
      return DEFAULT_LOG_TYPE_COLORS[type] || CUSTOM_LOG_COLORS[0].value;
    }
    function logTypeColor(type) {
      settings.logTypeColors = settings.logTypeColors || {};
      if (settings.logTypeColors[type]) return settings.logTypeColors[type];
      if (isCustomType(type)) return customTypeById(type)?.color || CUSTOM_LOG_COLORS[0].value;
      return defaultTypeColor(type);
    }
    function customTypeColor(type) {
      return logTypeColor(type);
    }
    function customCardClass(type) {
      return 'card-custom';
    }
    function describeEntry(e) {
      const bits = [];
      if (e.type === 'one') {
        if (e.one_urgent) bits.push('urgent');
        if (e.one_pre_activity) bits.push('pre-activity');
        if (e.one_uncomfortable) bits.push('uncomfortable');
        if (e.one_volume_low) bits.push('low');
        if (e.one_volume_standard) bits.push('standard');
        if (e.one_volume_high) bits.push('high');
      }
      if (e.type === 'two') {
        if (e.two_urgent) bits.push('urgent');
        if (e.two_uncomfortable) bits.push('uncomfortable');
        if (e.two_solid) bits.push('solid');
        if (e.two_loose) bits.push('loose');
        if (e.two_liquid) bits.push('liquid');
      }
      if (e.type === 'feeling' && e.feeling_rating) {
        const feelingLabels = { very_bad: 'very bad', bad: 'bad', neutral: 'neutral', good: 'good', great: 'great', real_bad: 'very bad', somewhat_bad: 'bad' };
        bits.push(feelingLabels[e.feeling_rating] || e.feeling_rating.replaceAll('_', ' '));
      }
      if (e.type === 'food' && Array.isArray(e.food_items)) {
        bits.push(...e.food_items);
      }
      if (e.notes) bits.push(`“${e.notes}”`);
      return bits.join(' · ') || 'No details';
    }

    function render() {
      updateSyncChip();
      $$('.screen').forEach(s => s.classList.remove('active'));
      $(`#${activeTab}Screen`).classList.add('active');
      $$('.nav button').forEach(b => b.classList.toggle('active', b.dataset.nav === activeTab));
      $('#pageTitle').textContent = ({ log: 'Log', calendar: 'Calendar', summary: 'Summary', settings: 'Settings' })[activeTab];
      const renderActive = { log: renderLog, calendar: renderCalendar, summary: renderSummary, settings: renderSettings }[activeTab];
      if (renderActive) renderActive();
    }

    function rewindSvg() {
      return `<svg class="rewind-icon" viewBox="0 0 48 48" fill="none" aria-hidden="true">
        <path d="M30 10 L14 24 L30 38" stroke="currentColor" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
      </svg>`;
    }

    function readableTextColor(hex) {
      const value = normalizeHex(hex);
      if (!isValidHex(value)) return '#f4f4f4';
      const full = value.length === 4 ? '#' + value.slice(1).split('').map(ch => ch + ch).join('') : value;
      const r = parseInt(full.slice(1, 3), 16);
      const g = parseInt(full.slice(3, 5), 16);
      const b = parseInt(full.slice(5, 7), 16);
      const brightness = (r * 299 + g * 587 + b * 114) / 1000;
      return brightness > 145 ? '#111111' : '#f4f4f4';
    }
    function logCardStyle(type) {
      const color = logTypeColor(type);
      return `style="--custom-log-color:${color}; --custom-log-text:${readableTextColor(color)};"`;
    }
    function entryColorStyle(type) {
      return `style="--entry-color:${logTypeColor(type)};"`;
    }

    function trackerCard(type, cardClass, counterText) {
      const labelHtml = settings.showLogScreenLabels ? `<div class="log-label">${escapeHtml(typeLabel(type))}</div>` : '';
      const counterHtml = settings.showLogElapsedSincePrevious
        ? `<div class="log-counter-row"><div class="counter">${counterText}</div>${labelHtml}</div>`
        : (settings.showLogScreenLabels ? `<div class="log-counter-row"><div></div>${labelHtml}</div>` : '');
      return `${counterHtml}
        <div class="tracker-card ${cardClass} log-colored" ${logCardStyle(type)}>
          <span class="log-card-dot" aria-hidden="true"></span>
          <button class="track-part left" data-action="log-previous" data-type="${type}" aria-label="Log previous">${rewindSvg()}</button>
          <button class="track-part right" data-action="log-now" data-type="${type}" aria-label="Log Now"><span class="track-now-label">Log Now</span></button>
        </div>`;
    }


    function isLogButtonVisible(type) {
      const defaults = { one: true, two: true, three: true, food: true, feeling: true };
      settings.visibleLogButtons = Object.assign(defaults, settings.visibleLogButtons || {});
      return !(settings.visibleLogButtons[type] === false || settings.visibleLogButtons[type] === 'false');
    }

    function renderLog() {
      const cards = [];
      if (isLogButtonVisible('one')) cards.push(trackerCard('one', 'card-one', `${formatSince('one')} (${oneCountToday()})`));
      if (isLogButtonVisible('two')) cards.push(trackerCard('two', 'card-two', formatSince('two')));
      if (isLogButtonVisible('three')) cards.push(trackerCard('three', 'card-three', formatSince('three')));
      if (isLogButtonVisible('food')) cards.push(trackerCard('food', 'card-food', formatSince('food')));
      activeCustomTypes().forEach(t => {
        if (isLogButtonVisible(t.id)) cards.push(trackerCard(t.id, customCardClass(t.id), formatSince(t.id)));
      });
      if (isLogButtonVisible('feeling')) cards.push(trackerCard('feeling', 'card-feeling', feelingStatusToday()));
      $('#logScreen').innerHTML = cards.length ? cards.join('') : `<div class="panel empty-state"><h3>No log buttons visible</h3><div class="small">Turn buttons back on in Settings → Log Types.</div></div>`;
    }

    function openSheet(html) {
      $('#sheet').innerHTML = html;
      $('#sheetBackdrop').classList.add('show');
      $('#sheet').classList.add('show');
    }
    function closeSheet() {
      $('#sheetBackdrop').classList.remove('show');
      $('#sheet').classList.remove('show');
      editingEntryId = null;
    }
    $('#sheetBackdrop').addEventListener('click', closeSheet);

    function openBackdateSheet(type) {
      const today = new Date();
      const yesterday = new Date(); yesterday.setDate(today.getDate() - 1);
      const defaultTime = `${pad(today.getHours())}:${pad(today.getMinutes())}`;
      openSheet(`
        <div class="sheet-head"><div class="sheet-title">Log previous</div><button class="icon-btn" onclick="closeSheet()">×</button></div>
        <div class="section-label">Day</div>
        <div class="two-col">
          <button class="pill selected" id="dayToday" onclick="selectBackdateDay('today')">Today</button>
          <button class="pill" id="dayYesterday" onclick="selectBackdateDay('yesterday')">Yesterday</button>
        </div>
        <div class="section-label">Time</div>
        <input id="backTime" type="time" value="${defaultTime}">
        <button class="save-btn" onclick="continueBackdate('${type}')">Continue</button>
      `);
      window.backdateDay = 'today';
    }
    function selectBackdateDay(day) {
      window.backdateDay = day;
      $('#dayToday').classList.toggle('selected', day === 'today');
      $('#dayYesterday').classList.toggle('selected', day === 'yesterday');
    }
    function continueBackdate(type) {
      const base = new Date();
      if (window.backdateDay === 'yesterday') base.setDate(base.getDate() - 1);
      const [h,m] = ($('#backTime').value || '12:00').split(':').map(Number);
      base.setHours(h || 0, m || 0, 0, 0);
      openEntrySheet(type, base, true);
    }

    function togglePill(btn) { btn.classList.toggle('selected'); }
    function selected(id) { const el = $('#' + id); return !!el && el.classList.contains('selected'); }

    function pill(id, label, active=false) {
      return `<button id="${id}" class="pill ${active ? 'selected' : ''}" onclick="togglePill(this)">${label}</button>`;
    }

    function normalizedFeeling(value) {
      return ({ real_bad: 'very_bad', somewhat_bad: 'bad' }[value] || value || '');
    }
    function feelingMeta(value) {
      const v = normalizedFeeling(value);
      return {
        very_bad: { cls: 'face-red', label: 'very bad', curve: -12, color: '#b84b4b' },
        bad: { cls: 'face-orange', label: 'bad', curve: -7, color: '#c47a36' },
        neutral: { cls: 'face-yellow', label: 'neutral', curve: 0, color: '#c9a84b' },
        good: { cls: 'face-pale-green', label: 'good', curve: 7, color: '#9dbc73' },
        great: { cls: 'face-green', label: 'great', curve: 12, color: '#5fa66a' }
      }[v] || null;
    }
    function mouthSvg(curve, color = 'currentColor') {
      const common = `stroke="${color}" stroke-linecap="round" stroke-linejoin="round" fill="none"`;
      if (curve === 0) return `<line x1="10.5" y1="23" x2="23.5" y2="23" ${common} />`;
      if (curve < 0) return `<path d="M10 26 Q17 ${26 - Math.abs(curve) / 2} 24 26" ${common} />`;
      return `<path d="M10 22 Q17 ${22 + curve / 2} 24 22" ${common} />`;
    }
    function rawFeelingSvg(meta, clipId = '') {
      if (!meta) return '';
      const color = meta.color;
      const clipAttr = clipId ? ` clip-path="url(#${clipId})"` : '';
      return `<g${clipAttr}>
        <circle cx="17" cy="17" r="14" stroke="${color}" stroke-width="2.8" fill="none" />
        <circle cx="12" cy="14" r="1.45" fill="${color}" stroke="none" />
        <circle cx="22" cy="14" r="1.45" fill="${color}" stroke="none" />
        ${mouthSvg(meta.curve, color)}
      </g>`;
    }
    function feelingSvg(value, sizeClass = '') {
      const meta = feelingMeta(value);
      if (!meta) return '';
      const size = sizeClass.includes('large') ? 42 : sizeClass.includes('small') ? 28 : 34;
      return `<span class="feeling-face ${meta.cls} ${sizeClass}" aria-label="${meta.label} feeling">
        <svg width="${size}" height="${size}" viewBox="0 0 34 34" aria-hidden="true" role="img" style="display:block;overflow:visible">
          ${rawFeelingSvg(meta)}
        </svg>
      </span>`;
    }
    function splitFeelingSvg(leftValue, rightValue, sizeClass = '') {
      const left = feelingMeta(leftValue);
      const right = feelingMeta(rightValue);
      if (!left && !right) return '';
      if (!left || !right || normalizedFeeling(leftValue) === normalizedFeeling(rightValue)) return feelingSvg(leftValue || rightValue, sizeClass);
      const id = `splitFace${Math.random().toString(36).slice(2)}`;
      const size = sizeClass.includes('large') ? 42 : sizeClass.includes('small') ? 28 : 34;
      return `<span class="feeling-face ${sizeClass}" aria-label="split feeling">
        <svg width="${size}" height="${size}" viewBox="0 0 34 34" aria-hidden="true" role="img" style="display:block;overflow:visible">
          <defs>
            <clipPath id="${id}Left"><rect x="0" y="0" width="17" height="34" /></clipPath>
            <clipPath id="${id}Right"><rect x="17" y="0" width="17" height="34" /></clipPath>
          </defs>
          ${rawFeelingSvg(left, `${id}Left`)}
          ${rawFeelingSvg(right, `${id}Right`)}
          <line x1="17" y1="3.5" x2="17" y2="30.5" stroke="rgba(255,255,255,.36)" stroke-width="1.1" stroke-linecap="round" />
        </svg>
      </span>`;
    }
    function faceButton(value, colorClass, ariaLabel, mouthCurve, currentValue) {
      const selectedClass = currentValue === value ? ' selected' : '';
      return `<button type="button" class="face-btn ${colorClass}${selectedClass}" data-feeling="${value}" aria-label="${ariaLabel}" onclick="selectFeeling(this)">
        ${feelingSvg(value)}
      </button>`;
    }

    function openEntrySheet(type, eventDate, isBackdated, entry = null) {
      editingEntryId = entry ? entry.id : null;
      const title = entry ? `Edit ${typeLabel(type)}` : typeLabel(type);
      const notes = entry?.notes || '';
      const eventIso = eventDate.toISOString();
      let body = '';
      if (type === 'one') {
        body = `
          <div class="section-label">Urgency</div>
          <div class="pill-grid">
            ${pill('one_urgent', 'Urgent', entry?.one_urgent)}
            ${pill('one_pre_activity', 'Pre-Activity', entry?.one_pre_activity)}
            ${pill('one_uncomfortable', 'Uncomfortable', entry?.one_uncomfortable)}
          </div>
          <div class="section-label">Volume</div>
          <div class="pill-grid">
            ${pill('one_volume_low', 'Low', entry?.one_volume_low)}
            ${pill('one_volume_standard', 'Standard', entry?.one_volume_standard)}
            ${pill('one_volume_high', 'High', entry?.one_volume_high)}
          </div>`;
      } else if (type === 'two') {
        body = `
          <div class="section-label">Urgency</div>
          <div class="pill-grid">
            ${pill('two_urgent', 'Urgent', entry?.two_urgent)}
            ${pill('two_uncomfortable', 'Uncomfortable', entry?.two_uncomfortable)}
          </div>
          <div class="section-label">Consistency</div>
          <div class="pill-grid">
            ${pill('two_solid', 'Solid', entry?.two_solid)}
            ${pill('two_loose', 'Loose', entry?.two_loose)}
            ${pill('two_liquid', 'Liquid', entry?.two_liquid)}
          </div>`;
      } else if (type === 'food') {
        const quickOptions = settings.foodQuickOptions || [];
        const selectedFood = Array.isArray(entry?.food_items) ? entry.food_items : [];
        body = quickOptions.length ? `
          <div class="section-label">Quick Log</div>
          <div class="pill-grid">
            ${quickOptions.map((opt, i) => pill(`food_item_${i}`, opt, selectedFood.includes(opt))).join('')}
          </div>` : `<div class="small" style="margin-top:8px;">No Food/Drink quick options yet. Add them in Settings.</div>`;
      } else if (type === 'feeling') {
        const val = ({ real_bad: 'very_bad', somewhat_bad: 'bad' }[entry?.feeling_rating] || entry?.feeling_rating || '');
        body = `
          <div class="section-label">Feeling</div>
          <div class="feeling-scale" id="feelingGrid" aria-label="Feeling scale">
            ${faceButton('very_bad', 'face-red', 'upset face', -12, val)}
            ${faceButton('bad', 'face-orange', 'sad face', -7, val)}
            ${faceButton('neutral', 'face-yellow', 'neutral face', 0, val)}
            ${faceButton('good', 'face-pale-green', 'slight smile face', 7, val)}
            ${faceButton('great', 'face-green', 'happy face', 12, val)}
          </div>`;
      }
      openSheet(`
        <div class="sheet-head"><div><div class="sheet-title">${title}</div><div class="small">${formatDate(eventDate)} · ${formatTime(eventDate)}</div></div><button class="icon-btn" onclick="closeSheet()">×</button></div>
        ${body}
        <div class="section-label">Notes</div>
        <textarea id="entryNotes" placeholder="Optional notes">${escapeHtml(notes)}</textarea>
        <button class="save-btn" onclick="saveEntry('${type}', '${eventIso}', ${isBackdated})">Save Entry</button>
        ${entry ? '<button class="danger-btn" onclick="deleteEntry(editingEntryId)">Delete Entry</button>' : ''}
      `);
    }
    function selectFeeling(btn) {
      $$('#feelingGrid .face-btn').forEach(p => p.classList.remove('selected'));
      btn.classList.add('selected');
    }

    function blankEntryFields() {
      return {
        one_urgent: false, one_pre_activity: false, one_uncomfortable: false, one_volume_low: false, one_volume_standard: false, one_volume_high: false,
        two_urgent: false, two_uncomfortable: false, two_solid: false, two_loose: false, two_liquid: false,
        feeling_rating: null,
        food_items: []
      };
    }
    function saveEntry(type, eventIso, isBackdated) {
      const now = nowIso();
      const base = {
        ...(editingEntryId ? entries.find(e => e.id === editingEntryId) : {}),
        ...blankEntryFields(),
        id: editingEntryId || uuid(),
        type,
        type_label: typeLabel(type),
        type_deleted_at: isCustomType(type) ? ((settings.customLogTypes || []).find(x => x.id === type)?.deleted_at || null) : null,
        event_at: eventIso,
        created_at: editingEntryId ? entries.find(e => e.id === editingEntryId).created_at : now,
        updated_at: now,
        is_backdated: !!isBackdated,
        notes: $('#entryNotes')?.value || '',
        sync_status: 'pending',
        deleted_at: null
      };
      if (type === 'one') {
        base.one_urgent = selected('one_urgent');
        base.one_pre_activity = selected('one_pre_activity');
        base.one_uncomfortable = selected('one_uncomfortable');
        base.one_volume_low = selected('one_volume_low');
        base.one_volume_standard = selected('one_volume_standard');
        base.one_volume_high = selected('one_volume_high');
      }
      if (type === 'two') {
        base.two_urgent = selected('two_urgent');
        base.two_uncomfortable = selected('two_uncomfortable');
        base.two_solid = selected('two_solid');
        base.two_loose = selected('two_loose');
        base.two_liquid = selected('two_liquid');
      }
      if (type === 'food') {
        const quickOptions = settings.foodQuickOptions || [];
        base.food_items = quickOptions.filter((_, i) => selected(`food_item_${i}`));
      }
      if (type === 'feeling') {
        const chosen = $('#feelingGrid .face-btn.selected');
        base.feeling_rating = chosen ? chosen.dataset.feeling : null;
        if (!editingEntryId) {
          const sameDayFeelings = entriesForTrackingDay(new Date(eventIso)).filter(e => e.type === 'feeling');
          if (sameDayFeelings.length >= 2) {
            toast('Max two feelings per day');
            return;
          }
        }
      }
      if (editingEntryId) entries = entries.map(e => e.id === editingEntryId ? base : e);
      else entries.push(base);
      saveEntries(); closeSheet(); render(); toast('Saved'); autoBackupPending();
    }
    function deleteEntry(id) {
      if (!id) return;
      if (!confirm('Delete this entry?')) return;
      const now = nowIso();
      entries = entries.map(e => e.id === id ? { ...e, deleted_at: now, updated_at: now, sync_status: 'pending' } : e);
      saveEntries(); closeSheet(); render(); toast('Deleted'); autoBackupPending();
    }

    function feelingsForDay(baseDate) {
      return entriesForTrackingDay(baseDate).filter(e => e.type === 'feeling' && e.feeling_rating);
    }
    function feelingSummaryForDay(baseDate) {
      const feelings = feelingsForDay(baseDate);
      if (!feelings.length) return '';
      const first = normalizedFeeling(feelings[0].feeling_rating);
      const last = normalizedFeeling(feelings[feelings.length - 1].feeling_rating);
      return splitFeelingSvg(first, last, 'small');
    }
    function setCalendarMode(mode) {
      calendarMode = mode;
      renderCalendar();
    }

    function renderCalendar() {
      const y = viewedMonth.getFullYear();
      const m = viewedMonth.getMonth();
      const first = new Date(y, m, 1);
      const daysInMonth = new Date(y, m + 1, 0).getDate();
      const startOffset = first.getDay();
      const monthName = viewedMonth.toLocaleDateString([], { month: 'long', year: 'numeric' });
      const today = new Date();
      let monthEntryCount = 0;
      let cells = '';
      for (let i=0; i<startOffset; i++) cells += `<div class="day empty"></div>`;
      for (let d=1; d<=daysInMonth; d++) {
        const date = new Date(y, m, d, 12, 0, 0);
        const dayEntries = entriesForTrackingDay(date);
        const count = dayEntries.filter(e => e.type === 'one').length;
        const feeling = feelingSummaryForDay(date);
        if (entriesForTrackingDay(date).length) monthEntryCount++;
        const isToday = y === today.getFullYear() && m === today.getMonth() && d === today.getDate();
        cells += `<button class="day ${isToday ? 'today' : ''}" onclick="openDayDetail('${date.toISOString()}')">
          <span class="date-num">${d}</span>
          ${calendarMode === 'pees'
            ? (count ? `<span class="badge ${badgeClass(count)}">${count}</span>` : '')
            : (feeling ? `<span class="feeling-day-badge">${feeling}</span>` : '')}
        </button>`;
      }
      $('#calendarScreen').innerHTML = `
        <div class="month-head">
          <button class="month-title" onclick="openYearPicker()">${monthName}</button>
          <button class="today-btn" onclick="goToThisMonth()">Current Month</button>
          <div class="arrow-row"><button onclick="changeMonth(-1)">‹</button><button onclick="changeMonth(1)">›</button></div>
        </div>
        <div class="calendar-toggle">
          <button class="${calendarMode === 'pees' ? 'active' : ''}" onclick="setCalendarMode('pees')">Pees</button>
          <button class="${calendarMode === 'feeling' ? 'active' : ''}" onclick="setCalendarMode('feeling')">Feeling</button>
        </div>
        <div class="dow"><div>S</div><div>M</div><div>T</div><div>W</div><div>T</div><div>F</div><div>S</div></div>
        <div class="calendar-grid">${cells}</div>
        ${!monthEntryCount ? `<div class="panel empty-state"><h3>No entries this month yet</h3><div class="small">Log an entry or use the arrows to view another month.</div></div>` : ''}
        ${calendarMode === 'pees' ? `<div class="legend" aria-label="Pee count legend">
          <div class="legend-item low-key">1–3</div><div class="legend-item mid-key">4–6</div><div class="legend-item high-key">7–8</div><div class="legend-item max-key">9+</div>
        </div>` : `<div class="small" style="margin-top:12px;text-align:center;">Feeling view shows one face for the day. If two different feelings were logged, the face is split first-to-last.</div>`}`;
    }
    function badgeClass(count) { return count <= 3 ? 'low' : count <= 6 ? 'mid' : count <= 8 ? 'high' : 'max'; }
    function changeMonth(delta) { viewedMonth = new Date(viewedMonth.getFullYear(), viewedMonth.getMonth() + delta, 1); renderCalendar(); }
    function goToThisMonth() { const now = new Date(); viewedMonth = new Date(now.getFullYear(), now.getMonth(), 1); renderCalendar(); }
    function validCalendarMonthsByYear() {
      const map = new Map();
      visibleEntries().forEach(e => {
        const d = new Date(e.event_at);
        if (Number.isNaN(d.getTime())) return;
        const y = d.getFullYear();
        const m = d.getMonth();
        if (!map.has(y)) map.set(y, new Set());
        map.get(y).add(m);
      });
      return map;
    }
    function openYearPicker() {
      const selectedYear = viewedMonth.getFullYear();
      const byYear = validCalendarMonthsByYear();
      const years = Array.from(byYear.keys()).sort((a,b) => b-a);
      if (!years.length) {
        openSheet(`
          <div class="sheet-head"><div><div class="sheet-title">Change month</div><div class="small">No saved entries yet.</div></div><button class="icon-btn" onclick="closeSheet()">×</button></div>
          <button class="save-btn" onclick="goToThisMonth(); closeSheet();">Current Month</button>
        `);
        return;
      }
      openSheet(`
        <div class="sheet-head"><div><div class="sheet-title">Choose year</div><div class="small">Only years with saved entries are shown.</div></div><button class="icon-btn" onclick="closeSheet()">×</button></div>
        <div class="year-grid">
          ${years.map(y => `<button class="year-btn ${y === selectedYear ? 'active' : ''}" onclick="openMonthPicker(${y})">${y}</button>`).join('')}
        </div>
      `);
    }
    function openMonthPicker(year) {
      const byYear = validCalendarMonthsByYear();
      const months = Array.from(byYear.get(year) || []).sort((a,b) => a-b);
      const currentMonth = viewedMonth.getFullYear() === year ? viewedMonth.getMonth() : -1;
      openSheet(`
        <div class="sheet-head"><div><div class="sheet-title">Choose month</div><div class="small">${year}</div></div><button class="icon-btn" onclick="closeSheet()">×</button></div>
        <div class="year-grid">
          ${months.map(m => `<button class="month-btn ${m === currentMonth ? 'active' : ''}" onclick="setCalendarMonth(${year}, ${m})">${new Date(year, m, 1).toLocaleDateString([], { month: 'short' })}</button>`).join('')}
        </div>
        <button class="secondary-btn" onclick="openYearPicker()">Back to years</button>
      `);
    }
    function setCalendarMonth(year, month) {
      viewedMonth = new Date(year, month, 1);
      closeSheet();
      renderCalendar();
    }

    function openDayDetail(iso) {
      const base = new Date(iso);
      const dayEntries = entriesForTrackingDay(base);
      const sortedPees = entriesOfType('one');
      const rows = dayEntries.length ? dayEntries.map(e => entryRow(e, sortedPees)).join('') : `<div class="small">No entries for this day.</div>`;
      const feeling = feelingSummaryForDay(base);
      openSheet(`
        <div class="sheet-head"><div><div class="day-title-row"><div class="sheet-title">${formatDate(base)}</div>${feeling || ''}</div><div class="small">4:00 AM day boundary</div></div><button class="icon-btn" onclick="closeSheet()">×</button></div>
        <div class="list">${rows}</div>
      `);
    }
    function previousOneInterval(entry, sortedPees = entriesOfType('one')) {
      if (entry.type !== 'one') return null;
      const eventTime = new Date(entry.event_at).getTime();
      for (let i = sortedPees.length - 1; i >= 0; i--) {
        const previous = sortedPees[i];
        if (previous.id === entry.id) continue;
        const previousTime = new Date(previous.event_at).getTime();
        if (previousTime < eventTime) {
          const hours = (eventTime - previousTime) / 36e5;
          return hours >= 0 ? hours : null;
        }
      }
      return null;
    }
    function entryLabels(e) {
      const labels = [];
      if (e.type === 'one') {
        if (e.one_urgent) labels.push('Urgent');
        if (e.one_pre_activity) labels.push('Pre-Activity');
        if (e.one_uncomfortable) labels.push('Uncomfortable');
        if (e.one_volume_low) labels.push('Low');
        if (e.one_volume_standard) labels.push('Standard');
        if (e.one_volume_high) labels.push('High');
      }
      if (e.type === 'two') {
        if (e.two_urgent) labels.push('Urgent');
        if (e.two_uncomfortable) labels.push('Uncomfortable');
        if (e.two_solid) labels.push('Solid');
        if (e.two_loose) labels.push('Loose');
        if (e.two_liquid) labels.push('Liquid');
      }
      if (e.type === 'food' && Array.isArray(e.food_items)) labels.push(...e.food_items);
      if (e.type === 'feeling' && e.feeling_rating) {
        const feelingLabels = { very_bad: 'Very bad', bad: 'Bad', neutral: 'Neutral', good: 'Good', great: 'Great', real_bad: 'Very bad', somewhat_bad: 'Bad' };
        labels.push(feelingLabels[e.feeling_rating] || e.feeling_rating.replaceAll('_', ' '));
      }
      return labels;
    }
    function entryRow(e, sortedPees = entriesOfType('one')) {
      const interval = previousOneInterval(e, sortedPees);
      const labels = entryLabels(e);
      const intervalText = interval === null ? '' : `<div class="entry-sub">${interval.toFixed(1)}h since last pee</div>`;
      const labelText = labels.length ? `<div class="${e.type === 'food' ? 'food-details' : 'entry-labels'}">${escapeHtml(labels.join(' · '))}</div>` : '';
      const noteText = e.notes ? `<div class="entry-note">${escapeHtml(e.notes)}</div>` : '';
      return `<div class="entry-row type-${e.type} log-entry-colored" ${entryColorStyle(e.type)}>
        <div class="entry-main"><div class="entry-title">${formatTime(new Date(e.event_at))} · ${typeLabel(e.type)}</div>${intervalText}${labelText}${noteText || (!labels.length ? '<div class="entry-sub">No details</div>' : '')}</div>
        <div class="row-actions"><button class="mini-btn" onclick="editEntry('${e.id}')">Edit</button><button class="mini-btn danger" onclick="deleteEntry('${e.id}')">Delete</button></div>
      </div>`;
    }
    function editEntry(id) {
      const e = entries.find(x => x.id === id); if (!e) return;
      openEntrySheet(e.type, new Date(e.event_at), e.is_backdated, e);
    }

    function renderSummary() {
      const one = entriesOfType('one');
      const countsByDay = [];
      for (let i=6;i>=0;i--) {
        const d = new Date(); d.setDate(d.getDate()-i);
        countsByDay.push(entriesForTrackingDay(d).filter(e => e.type === 'one').length);
      }
      const avgCount = countsByDay.reduce((a,b)=>a+b,0) / 7;
      const lastTenOne = one.slice(-10);
      const lastTenIntervals = getIntervals(lastTenOne);
      const avgLastTenInterval = lastTenIntervals.length ? lastTenIntervals.reduce((a,b)=>a+b,0)/lastTenIntervals.length : null;
      const thirtyAgo = new Date(); thirtyAgo.setDate(thirtyAgo.getDate() - 30);
      const releases30 = entriesOfType('three').filter(e => new Date(e.event_at) >= thirtyAgo).length;

      const timelineDate = summaryViewedDate || new Date();
      const timelineEntries = entriesForTrackingDay(timelineDate);
      const dailyNote = dailyNoteForDay(timelineDate);
      const dailyNoteHtml = dailyNote ? `<div class="daily-note-box"><strong>Daily note</strong><div class="small">${escapeHtml(dailyNote)}</div></div>` : '';
      const timeline = timelineEntries.length ? timelineEntries.map(e => {
        const labels = entryLabels(e);
        const note = e.notes ? `<div class="entry-note">${escapeHtml(e.notes)}</div>` : '';
        const details = labels.length ? `<div class="${e.type === 'food' ? 'food-details' : 'entry-labels'}">${escapeHtml(labels.join(' · '))}</div>` : '';
        return `<div class="timeline-row type-${e.type} log-entry-colored" ${entryColorStyle(e.type)}><div class="timeline-time">${formatTime(new Date(e.event_at))}</div><div class="timeline-main"><strong>${typeLabel(e.type)}</strong>${details}${note}</div></div>`;
      }).join('') : `<div class="empty-state"><h3>No entries logged for this day</h3><div class="small">Use the Log tab to add entries, or move to another day.</div></div>`;

      const isToday = isSameTrackingDay(timelineDate, new Date());
      $('#summaryScreen').innerHTML = `
        <div class="stat-grid">
          <div class="stat"><div class="value">${oneCountToday()}</div><div class="label">pees today</div></div>
          <div class="stat"><div class="value">${avgCount.toFixed(1)}</div><div class="label">7-day pee average</div></div>
          <div class="stat"><div class="value">${avgLastTenInterval ? avgLastTenInterval.toFixed(1)+'h' : '—'}</div><div class="label">avg interval, last 10 pees</div></div>
          <div class="stat"><div class="value">${releases30}</div><div class="label">releases, last 30 days</div></div>
        </div>
        <div class="panel" style="margin-top:12px;">
          <div class="summary-day-head">
            <div class="summary-day-title">
              <h2>${isToday ? 'Today' : formatDate(timelineDate)}</h2>
              <div class="small">Timeline</div>
            </div>
            <button class="today-btn" onclick="goToCurrentSummaryDay()">Current Day</button>
            <button class="today-btn" onclick="openDailyNoteSheet(summaryViewedDate || new Date())">Daily Note</button>
            <button class="today-btn" onclick="openTimelineEditor(summaryViewedDate || new Date())">Edit Day</button>
            <div class="arrow-row"><button onclick="changeSummaryDay(-1)">‹</button><button onclick="changeSummaryDay(1)">›</button></div>
          </div>
          ${dailyNoteHtml}
          <div class="timeline">${timeline}</div>
        </div>
      `;
    }



    function dailyNoteForDay(date) {
      settings.dailyNotes = settings.dailyNotes || {};
      return settings.dailyNotes[trackingDayKey(date)] || '';
    }
    function openDailyNoteSheet(date = new Date()) {
      const d = new Date(date);
      const key = trackingDayKey(d);
      const note = settings.dailyNotes?.[key] || '';
      openSheet(`
        <div class="sheet-head"><div><div class="sheet-title">Daily Note</div><div class="small">${formatDate(startOfTrackingDay(d))}</div></div><button class="icon-btn" onclick="closeSheet()">×</button></div>
        <textarea id="dailyNoteText" placeholder="Optional note for this tracking day">${escapeHtml(note)}</textarea>
        <button class="save-btn" onclick="saveDailyNote('${key}')">Save Note</button>
        ${note ? `<button class="danger-btn" onclick="clearDailyNote('${key}')">Clear Note</button>` : ''}
      `);
    }
    function saveDailyNote(key) {
      settings.dailyNotes = settings.dailyNotes || {};
      const value = ($('#dailyNoteText')?.value || '').trim();
      if (value) settings.dailyNotes[key] = value;
      else delete settings.dailyNotes[key];
      saveSettings();
      closeSheet();
      render();
      toast('Daily note saved');
    }
    function clearDailyNote(key) {
      if (!confirm('Clear this daily note?')) return;
      settings.dailyNotes = settings.dailyNotes || {};
      delete settings.dailyNotes[key];
      saveSettings();
      closeSheet();
      render();
      toast('Daily note cleared');
    }
    function openTimelineEditor(date = new Date()) {
      const d = new Date(date);
      const dayEntries = entriesForTrackingDay(d);
      const sortedPees = entriesOfType('one');
      const rows = dayEntries.length ? dayEntries.map(e => entryRow(e, sortedPees)).join('') : `<div class="empty-state"><h3>No entries to edit</h3><div class="small">This tracking day does not have any entries yet.</div></div>`;
      openSheet(`
        <div class="sheet-head"><div><div class="sheet-title">Edit Timeline</div><div class="small">${formatDate(startOfTrackingDay(d))}</div></div><button class="icon-btn" onclick="closeSheet()">×</button></div>
        <div class="list">${rows}</div>
      `);
    }

    function isSameTrackingDay(a, b) {
      return startOfTrackingDay(a).getTime() === startOfTrackingDay(b).getTime();
    }
    function changeSummaryDay(delta) {
      const d = new Date(summaryViewedDate || new Date());
      d.setDate(d.getDate() + delta);
      summaryViewedDate = d;
      renderSummary();
    }
    function goToCurrentSummaryDay() {
      summaryViewedDate = new Date();
      renderSummary();
    }

    function getIntervals(sortedEntries) {
      const sorted = [...sortedEntries].sort((a,b)=> new Date(a.event_at)-new Date(b.event_at));
      const out = [];
      for (let i=1; i<sorted.length; i++) out.push((new Date(sorted[i].event_at) - new Date(sorted[i-1].event_at))/36e5);
      return out.filter(h => h >= 0);
    }

          <div class="sync-form">

      return `<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 20h4l10.5-10.5a2.8 2.8 0 0 0-4-4L4 16v4z"></path><path d="M13.5 6.5l4 4"></path></svg>`;

          <button class="edit-icon-btn" aria-label="Change ${escapeHtml(label)} color" onclick="event.stopPropagation(); openLogTypeColorPicker('${type}')">${pencilIcon()}</button>
          <button type="button" class="toggle-switch ${on ? 'on' : ''}" aria-label="${on ? 'Hide' : 'Show'} ${escapeHtml(label)}" onclick="event.stopPropagation(); setLogButtonVisibility('${type}', ${next})"></button>
        </div>
      </div>`;
    }
    function normalizeVisibleLogButtons() {
      const defaults = { one: true, two: true, three: true, food: true, feeling: true };

    }
    function setLogButtonVisibility(type, visible) {

    function customLogTypeRows() {
      const types = activeCustomTypes();
      if (!types.length) return '';

    function addCustomLogType() {
      const value = prompt('Add custom log type');
      if (!value || !value.trim()) return;
      const label = value.trim();
      settings.customLogTypes = settings.customLogTypes || [];
      const id = 'custom_' + Date.now() + '_' + Math.random().toString(36).slice(2,7);
      settings.customLogTypes.push({ id, label, color: CUSTOM_LOG_COLORS[0].value, created_at: nowIso(), updated_at: nowIso(), deleted_at: null });
      settings.visibleLogButtons = settings.visibleLogButtons || {};
      settings.visibleLogButtons[id] = true;
      saveSettings(); render(); toast('Log type added');
    }
    function openCustomLogTypeEditor(id) {
      const item = customTypeById(id);

      openSheet(`
        <div class="sheet-head"><div><div class="sheet-title">Edit Log Type</div><div class="small">${escapeHtml(item.label)}</div></div><button class="icon-btn" onclick="closeSheet()">×</button></div>

        <button class="danger-btn" onclick="deleteCustomLogType('${id}')">Delete Log Type</button>
      `);

    function renameCustomLogType(id) {
      const item = (settings.customLogTypes || []).find(x => x.id === id);
      if (!item) return;
      const value = prompt('Rename log type', item.label);
      if (!value || !value.trim()) return;
      item.label = value.trim();
      item.updated_at = nowIso();
      saveSettings(); closeSheet(); render(); toast('Log type renamed');
    }
    function deleteCustomLogType(id) {
      const item = (settings.customLogTypes || []).find(x => x.id === id);
      if (!item) return;
      if (!confirm(`Delete "${item.label}" from the Log screen? Existing entries will stay in exports.`)) return;
      item.deleted_at = nowIso();
      item.updated_at = nowIso();
      settings.visibleLogButtons = settings.visibleLogButtons || {};
      settings.visibleLogButtons[id] = false;
      saveSettings(); closeSheet(); render(); toast('Log type deleted');
    }
    function openLogTypeColorPicker(id) {
      const label = typeLabel(id);
      const currentColor = logTypeColor(id);
      openSheet(`
        <div class="sheet-head"><div><div class="sheet-title">Color</div><div class="small">${escapeHtml(label)}</div></div><button class="icon-btn" onclick="closeSheet()">×</button></div>
        <div class="custom-color-grid">
          ${CUSTOM_LOG_COLORS.map(c => `<button class="color-choice" style="background:${c.value}" aria-label="${c.name}" onclick="setLogTypeColor('${id}', '${c.value}')"></button>`).join('')}
        </div>

        <div class="section-label">Custom Hex</div>
        <div class="hex-color-row">
          <div id="customHexPreview" class="hex-preview" style="background:${currentColor}"></div>
          <input id="customHexInput" value="${escapeHtml(currentColor)}" placeholder="#6f8f73" maxlength="7" oninput="updateHexPreview()">
        </div>
        <button class="save-btn" onclick="applyCustomHex('${id}')">Apply Hex Color</button>

        ${isCustomType(id) ? `<button class="secondary-btn" onclick="openCustomLogTypeEditor('${id}')">Back</button>` : ''}
      `);
    }
    function normalizeHex(value) {
      value = String(value || '').trim();
      if (!value) return '';
      if (!value.startsWith('#')) value = '#' + value;
      return value;
    }
    function isValidHex(value) {
      return /^#([0-9A-F]{3}|[0-9A-F]{6})$/i.test(value);
    }
    function updateHexPreview() {
      const input = document.getElementById('customHexInput');
      const preview = document.getElementById('customHexPreview');
      if (!input || !preview) return;
      const value = normalizeHex(input.value);
      if (isValidHex(value)) {
        preview.style.background = value;
        input.style.borderColor = 'var(--accent-2)';
      } else {
        preview.style.background = 'var(--panel-2)';
        input.style.borderColor = 'rgba(168,68,68,.75)';
      }
    }
    function applyCustomHex(id) {
      const input = document.getElementById('customHexInput');
      if (!input) return;
      const value = normalizeHex(input.value);
      if (!isValidHex(value)) {
        toast('Invalid hex code');
        return;
      }
      setLogTypeColor(id, value);
    }

    function openCustomColorPicker(id) {
      openLogTypeColorPicker(id);
    }
    function setLogTypeColor(id, color) {
      settings.logTypeColors = settings.logTypeColors || {};

      const item = customTypeById(id);

        item.color = color;
        item.updated_at = nowIso();
